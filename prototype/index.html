<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d12" />
    <title>Necro Summoner — v0.2 Action</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        overscroll-behavior: none;
      }
      body {
        background: #0d0d12;
        color: #d8d4c8;
        font-family: "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        min-height: 100vh;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 2px;
        color: #b89860;
      }
      .subtitle {
        font-size: 12px;
        opacity: 0.55;
        margin-bottom: 8px;
        text-align: center;
      }
      #wrap {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        max-width: 100%;
      }
      canvas {
        background: #0a0a0e;
        border: 1px solid #3a3a4a;
        image-rendering: pixelated;
        cursor: crosshair;
        display: block;
        max-width: 100%;
        height: auto;
        touch-action: none;
      }
      #panel {
        width: 240px;
        background: #16161e;
        border: 1px solid #3a3a4a;
        padding: 12px;
        font-size: 12px;
        line-height: 1.55;
      }
      .stat {
        display: flex;
        justify-content: space-between;
      }
      .stat b {
        color: #b89860;
      }
      hr {
        border: 0;
        border-top: 1px dashed #3a3a4a;
        margin: 8px 0;
      }
      .key {
        display: inline-block;
        background: #2a2a36;
        border: 1px solid #4a4a5a;
        padding: 1px 6px;
        margin: 0 2px;
        font-size: 11px;
      }
      #log {
        height: 130px;
        overflow-y: auto;
        font-size: 11px;
        background: #0d0d12;
        padding: 6px;
        border: 1px solid #3a3a4a;
        margin-top: 6px;
      }
      .banner {
        text-align: center;
        font-size: 14px;
        color: #c84040;
        margin: 6px 0;
        min-height: 18px;
      }
      #levelup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 12px;
      }
      #levelup.show {
        display: flex;
      }
      #levelup .box {
        background: #1a1a22;
        border: 2px solid #b89860;
        padding: 20px;
        max-width: 560px;
        width: 100%;
        text-align: center;
      }
      #levelup h2 {
        color: #b89860;
        font-size: 20px;
        margin-bottom: 14px;
      }
      #levelup .perks {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .perk {
        flex: 1;
        background: #2a2a36;
        border: 1px solid #4a4a5a;
        padding: 14px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1.5;
        text-align: left;
      }
      .perk:hover,
      .perk:active {
        background: #3a3a4a;
        border-color: #b89860;
      }
      .perk b {
        color: #b89860;
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .perk .desc {
        opacity: 0.85;
      }
      .ctrlrow {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .ctrlrow button {
        flex: 1;
        background: #2a2a36;
        color: #d8d4c8;
        border: 1px solid #4a4a5a;
        padding: 8px 4px;
        font-family: inherit;
        cursor: pointer;
        font-size: 11px;
      }
      .ctrlrow button:active {
        background: #3a3a4a;
        border-color: #b89860;
      }
      .langrow {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .langrow button {
        flex: 1;
        background: #2a2a36;
        color: #d8d4c8;
        border: 1px solid #4a4a5a;
        padding: 4px;
        font-family: inherit;
        cursor: pointer;
        font-size: 11px;
      }
      .langrow button.on {
        background: #3a3a4a;
        border-color: #b89860;
        color: #b89860;
      }

      /* ---------- mobile / portrait layout ---------- */
      @media (max-width: 820px) {
        body {
          padding: 6px;
        }
        h1 {
          font-size: 14px;
          letter-spacing: 1px;
        }
        .subtitle {
          font-size: 10px;
          margin-bottom: 4px;
        }
        #wrap {
          flex-direction: column;
          gap: 6px;
          width: 100%;
          align-items: stretch;
        }
        canvas {
          width: 100%;
          max-width: 100vw;
        }
        #panel {
          width: 100%;
        }
        #log {
          height: 70px;
        }
        #levelup .perks {
          flex-direction: column;
          gap: 8px;
        }
      }
    </style>
  </head>

        if (!I18N[lang]) lang = "en";
        let L = I18N[lang];

        // ============================================================
        // CONSTANTS
        // ============================================================
        const cv = document.getElementById("game");
        const ctx = cv.getContext("2d");
        const VW = cv.width,
          VH = cv.height;
        const WORLD_W = VW,
          WORLD_H = VH; // arena = one viewport, no scrolling
        const GAME_DURATION = 300; // 5 min in seconds
        const TILE_BG = 64;

        // ============================================================
        // ASSET LOADER (LPC bodies + FLARE dungeon)
        // ============================================================
        const ASSETS = "../public";
        const SPR = {
          skel: ASSETS + "/skeleton.png",
          zomb: ASSETS + "/zombie.png",
          male: ASSETS + "/male_walk.png",
          dungeon: ASSETS + "/tileset_dungeon.png",
        };
        const IMG = {};
        let loaded = 0,
          total = 0,
          ready = false;
        for (const [k, src] of Object.entries(SPR)) {
          total++;
          const img = new Image();
          img.onload = img.onerror = () => {
            loaded++;
            if (loaded === total) ready = true;
          };
          img.src = src;
          IMG[k] = img;
        }
        const TINTS = {};
        function tintSheet(src, color) {
          const c = document.createElement("canvas");
          c.width = src.width;
          c.height = src.height;
          const x = c.getContext("2d");
          x.drawImage(src, 0, 0);
          x.globalCompositeOperation = "multiply";
          x.fillStyle = color;
          x.fillRect(0, 0, c.width, c.height);
          x.globalCompositeOperation = "destination-in";
          x.drawImage(src, 0, 0);
          return c;
        }
        function ensureTints() {
          if (TINTS.ready || !ready) return;
          if (!IMG.skel.complete || !IMG.zomb.complete || !IMG.male.complete)
            return;
          TINTS.skelGreen = tintSheet(IMG.skel, "#90ff90");
          TINTS.skelPurple = tintSheet(IMG.skel, "#c890ff");
          TINTS.skelGray = tintSheet(IMG.skel, "#a8b0c0");
          TINTS.skelRed = tintSheet(IMG.skel, "#ff6060");
          TINTS.skelOrange = tintSheet(IMG.skel, "#ffa040");
          TINTS.zombRed = tintSheet(IMG.zomb, "#ff6060");
          TINTS.zombGreen = tintSheet(IMG.zomb, "#80c080");
          TINTS.zombGray = tintSheet(IMG.zomb, "#a0a0a0");
          TINTS.malePurple = tintSheet(IMG.male, "#a070ff");
          TINTS.ready = true;
        }
        function lpcFrame(facing, t) {
          const row =
            facing === "left"
              ? 1
              : facing === "up"
                ? 0
                : facing === "down"
                  ? 2
                  : 3;
          const col = 1 + (Math.floor(t / 100) % 8);
          return { sx: col * 64, sy: row * 64 };
        }
        function drawSprite(sheet, facing, t, x, y, scale) {
          if (!sheet || (!sheet.complete && sheet.tagName !== "CANVAS"))
            return false;
          const f = lpcFrame(facing, t);
          const dw = 64 * scale,
            dh = 64 * scale;
          ctx.drawImage(
            sheet,
            f.sx,
            f.sy,
            64,
            64,
            x - dw / 2,
            y - dh + 14,
            dw,
            dh,
          );
          return true;
        }

        // ============================================================
        // NAMES + BACKSTORIES (v0.2 differentiator: each minion has identity)
        // First names + titles are language-neutral; backstory is looked up
        // by index at log time so language toggle relocalises old log entries

        // TOUCH JOYSTICK (drag-anywhere on canvas)
        // ============================================================
        const JOY_DEAD = 8; // px
        const JOY_MAX = 48; // px — full speed at this radius
        function canvasPt(e) {
          const r = cv.getBoundingClientRect();
          const t = e.touches && e.touches[0] ? e.touches[0] : e;
          const x = ((t.clientX - r.left) / r.width) * cv.width;
          const y = ((t.clientY - r.top) / r.height) * cv.height;
          return { x, y };
        }
        cv.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            const p = canvasPt(e);
            state.touch.active = true;
            state.touch.ox = p.x;
            state.touch.oy = p.y;
            state.touch.x = p.x;
            state.touch.y = p.y;
            state.touch.dx = 0;
            state.touch.dy = 0;
          },
          { passive: false },
        );
        cv.addEventListener(
          "touchmove",
          (e) => {
            if (!state.touch.active) return;
            e.preventDefault();
            const p = canvasPt(e);
            state.touch.x = p.x;
            state.touch.y = p.y;
            let dx = p.x - state.touch.ox;
            let dy = p.y - state.touch.oy;
            const m = Math.hypot(dx, dy);
            if (m < JOY_DEAD) {
              dx = 0;
              dy = 0;
            } else {
              const norm = Math.min(m, JOY_MAX) / m;
              dx *= norm;
              dy *= norm;
              if (m > JOY_MAX) {
                state.touch.ox = p.x - dx;
                state.touch.oy = p.y - dy;
              }
            }
            state.touch.dx = dx / JOY_MAX;
            state.touch.dy = dy / JOY_MAX;
          },
          { passive: false },
        );
        const endTouch = (e) => {
          if (e) e.preventDefault();
          state.touch.active = false;
          state.touch.dx = 0;
          state.touch.dy = 0;
        };

        cv.addEventListener("touchcancel", endTouch, { passive: false });

        // ============================================================
        // AI / TICK
        // ============================================================
        function pickTargetFor(unit, pool, mode) {
          if (!pool.length) return null;
          let best = null,
            bestKey = Infinity;
          for (const e of pool) {
            if (e.hp <= 0) continue;
            let k;
            if (mode === "weakest") k = e.hp;
            else if (mode === "strongest") k = -e.hp;
            else k = dist(unit, e);
            if (k < bestKey) {
              bestKey = k;
              best = e;
            }
          }
          return best;
        }
        function moveToward(u, tx, ty, sp) {
          const dx = tx - u.x,
            dy = ty - u.y;
          const d = Math.hypot(dx, dy) || 1;
          u.x += (dx / d) * sp;
          u.y += (dy / d) * sp;
          if (Math.abs(dx) > Math.abs(dy)) u.facing = dx > 0 ? "right" : "left";
          else u.facing = dy > 0 ? "down" : "up";
        }
        function updatePlayer() {
          const p = state.player;
          let dx = 0,
            dy = 0;
          if (keys.KeyW || keys.ArrowUp) dy -= 1;
          if (keys.KeyS || keys.ArrowDown) dy += 1;
          if (keys.KeyA || keys.ArrowLeft) dx -= 1;
          if (keys.KeyD || keys.ArrowRight) dx += 1;
          if (state.touch.active) {
            dx += state.touch.dx;
            dy += state.touch.dy;
          }
          const m = Math.hypot(dx, dy);
          p.moving = m > 0.05;
          if (p.moving) {
            const mag = Math.min(1, m);
            const nx = dx / m,
              ny = dy / m;
            p.x += nx * p.speed * mag;
            p.y += ny * p.speed * mag;
            p.x = clamp(p.x, 16, WORLD_W - 16);
            p.y = clamp(p.y, 16, WORLD_H - 16);
            if (Math.abs(dx) >= Math.abs(dy))
              p.facing = dx > 0 ? "right" : "left";
            else p.facing = dy > 0 ? "down" : "up";
          }

          if (p.atkCd > 0) p.atkCd--;

          if (p.atkCd <= 0) {
            const tgt = pickTargetFor(p, state.enemies, state.priority);
            if (tgt && dist(p, tgt) <= p.atkRange) {
              p.atkCd = p.atkCdMax;
              state.projectiles.push({
                x: p.x,
                y: p.y,
                tx: tgt,
                dmg: 8 * state.perks.dmg,
                color: "#a0e0ff",
                speed: 5 * state.perks.projSpeed,
                friendly: true,
                from: "player",
              });
            }
          }

          if (state.perks.hpRegen > 0 && state.tick % 60 === 0) {
            p.hp = Math.min(p.hpMax, p.hp + state.perks.hpRegen);
          }
        }
        function updateMinion(m) {
          if (m.hp <= 0) return;
          const LEASH = 180;
          if (
            !m.target ||
            m.target.hp <= 0 ||
            dist(m.target, state.player) > LEASH
          ) {
            let best = null,
              bestKey = Infinity;
            for (const e of state.enemies) {
              if (e.hp <= 0) continue;
              if (dist(e, state.player) > LEASH) continue;
              const k =
                state.priority === "weakest"
                  ? e.hp
                  : state.priority === "strongest"
                    ? -e.hp
                    : dist(m, e);
              if (k < bestKey) {
                bestKey = k;
                best = e;
              }
            }
            m.target = best;
          }
          const distFromPlayer = dist(m, state.player);
          let goalX,
            goalY,
            sp = m.speed;
          if (m.target) {
            const dToTgt = dist(m, m.target);
            if (dToTgt > m.range) {
              goalX = m.target.x;
              goalY = m.target.y;
            } else {
              if (m.cd <= 0) {
                m.cd = m.atkCd;
                const dmg = m.dmg * state.perks.dmg;
                if (m.attack === "ranged") {
                  state.projectiles.push({
                    x: m.x,
                    y: m.y,
                    tx: m.target,
                    dmg,
                    color: m.projColor || "#a8ff90",
                    speed: (m.projSpeed || 5) * state.perks.projSpeed,
                    friendly: true,
                    from: "minion",
                  });
                } else {
                  m.target.hp -= dmg;
                  float(
                    m.target.x,
                    m.target.y,
                    "-" + Math.floor(dmg),
                    "#ff8080",
                  );
                }
              }
              m.moving = false;
              if (m.cd > 0) m.cd--;
              return;
            }
          } else {
            const orbitR = 56;
            if (m.orbitAng === undefined)
              m.orbitAng = Math.random() * Math.PI * 2;
            m.orbitAng += 0.015;
            goalX = state.player.x + Math.cos(m.orbitAng) * orbitR;
            goalY = state.player.y + Math.sin(m.orbitAng) * orbitR;
          }
          if (distFromPlayer > 140) sp *= 1.6;
          moveToward(m, goalX, goalY, sp);
          m.moving = true;
          if (m.cd > 0) m.cd--;
        }
        function updateEnemy(e) {
          if (e.hp <= 0) return;
          let tgt = state.player;
          let bestD = dist(e, state.player);
          for (const m of state.minions) {
            if (m.hp <= 0) continue;
            const d = dist(e, m);
            if (d < bestD) {
              bestD = d;
              tgt = m;
            }
          }
          e.target = tgt;
          if (bestD > e.range) {
            moveToward(e, tgt.x, tgt.y, e.speed);
            e.moving = true;
          } else {
            e.moving = false;
            if (e.cd <= 0) {
              e.cd = e.atkCd;
              if (e.attack === "ranged") {
                state.projectiles.push({
                  x: e.x,
                  y: e.y,
                  tx: tgt,
                  dmg: e.dmg,
                  color: e.projColor || "#ff80ff",
                  speed: e.projSpeed || 4,
                  friendly: false,
                  from: "enemy",
                });
              } else {
                tgt.hp -= e.dmg;
                float(tgt.x, tgt.y, "-" + e.dmg, "#ffaa44");
              }
            }
          }
          if (e.cd > 0) e.cd--;
        }
        function updateProjectile(p) {
          if (!p.tx || p.tx.hp <= 0) {
            p.dead = true;
            return;
          }
          const dx = p.tx.x - p.x,
            dy = p.tx.y - p.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 6) {
            p.tx.hp -= p.dmg;
            float(
              p.tx.x,
              p.tx.y,
              "-" + Math.floor(p.dmg),
              p.friendly ? "#ff8080" : "#ffaa44",
            );
            p.dead = true;
            return;
          }
          p.x += (dx / d) * p.speed;
          p.y += (dy / d) * p.speed;
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        function update() {
          if (state.paused || state.over) return;
          state.tick++;

          if (state.tick % 60 === 0) state.time = Math.max(0, state.time - 1);
          if (state.time <= 0 && !state.bossSpawned) spawnBoss();

          updatePlayer();

          if (state.minions.length < state.maxMinions) {
            state.autoSummonCd--;
            if (state.autoSummonCd <= 0) {
              if (autoSummonOne()) {
                state.autoSummonCd =
                  state.autoSummonCdMax * state.perks.summonCdMul;
              } else {
                state.autoSummonCd = 30;
              }
            }
          } else {
            state.autoSummonCd = Math.min(
              state.autoSummonCd,
              state.autoSummonCdMax * state.perks.summonCdMul,
            );
          }

          if (!state.bossSpawned) {
            state.spawnCd--;
            if (state.spawnCd <= 0) {
              const elapsed = GAME_DURATION - state.time;
              const rate = Math.max(14, 60 - elapsed * 0.14);
              state.spawnCd = rate;
              const batch = 1 + Math.floor(elapsed / 90);
              const cap = 30;
              for (let i = 0; i < batch; i++) {
                if (state.enemies.length >= cap) break;
                spawnEnemy();
              }
            }
          }

          for (const m of state.minions) updateMinion(m);
          for (const e of state.enemies) updateEnemy(e);
          for (const p of state.projectiles) updateProjectile(p);

          state.enemies = state.enemies.filter((e) => {
            if (e.hp <= 0) {
              state.kills++;
              gainXp(e.soul);
              state.pickups.push({
                x: e.x,
                y: e.y,
                kind: "soul",
                value: e.soul,
              });
              float(e.x, e.y - 10, "+" + e.soul + "xp", "#ffe080");
              if (e.kindId === "boss") {
                state.won = true;
                state.over = true;
                banner(L.bannerVictory, "#80c850");
                log(L.logVictory, "#80c850");
              }
              return false;
            }
            return true;
          });
          state.minions = state.minions.filter((m) => {
            if (m.hp <= 0) {
              log(
                L.logMinionDeath(
                  m.name,
                  L.backstories[m.storyId] || "",
                  m.kills,
                ),
                "#a86060",
              );
              float(m.x, m.y, "☠ " + m.name, "#a86060");
              return false;
            }
            return true;
          });
          state.projectiles = state.projectiles.filter((p) => !p.dead);
          state.fx = state.fx.filter((f) => {
            f.life--;
            if (f.kind === "nova") f.r = f.rMax * (1 - f.life / 30);
            return f.life > 0;
          });
          state.floats = state.floats.filter((f) => {
            f.life--;
            f.y -= 0.6;
            return f.life > 0;
          });

          for (const pk of state.pickups) {
            const d = dist(pk, state.player);
            if (d < state.perks.soulMagnet) {
              const dx = state.player.x - pk.x,
                dy = state.player.y - pk.y;
              const m = Math.hypot(dx, dy) || 1;
              const sp = Math.max(2, 6 - d / 30);
              pk.x += (dx / m) * sp;
              pk.y += (dy / m) * sp;
            }
            if (d < 18) {
              pk.dead = true;
              state.souls += pk.value;
            }
          }
          state.pickups = state.pickups.filter((p) => !p.dead);

          if (state.player.hp <= 0 && !state.over) {
            state.over = true;
            banner(L.bannerDeath, "#c83030");
            log(L.logDeath, "#c83030");
          }

          camera.x = clamp(state.player.x - VW / 2, 0, WORLD_W - VW);
          camera.y = clamp(state.player.y - VH / 2, 0, WORLD_H - VH);

          updatePanel();
        }

        function updatePanel() {
          const m = Math.floor(state.time / 60),
            s = state.time % 60;
          document.getElementById("time").textContent =
            `${m}:${s.toString().padStart(2, "0")}`;
          document.getElementById("hp").textContent =
            `${Math.max(0, Math.ceil(state.player.hp))}/${state.player.hpMax}`;
          document.getElementById("lvl").textContent =
            `${state.level} (${state.xp}/${state.xpNext})`;
          document.getElementById("souls").textContent = state.souls;
          document.getElementById("army").textContent =
            `${state.minions.length}/${state.maxMinions}`;
          document.getElementById("kills").textContent = state.kills;
          const cdEl = document.getElementById("cdsummon");
          if (cdEl) {
            if (state.minions.length >= state.maxMinions) {
              cdEl.textContent = L.armyFull;
            } else {
              cdEl.textContent = L.summonIn(
                (state.autoSummonCd / 60).toFixed(1),
              );
            }
          }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function drawBg() {
          ensureTints();
          if (ready && IMG.dungeon.complete && IMG.dungeon.naturalWidth > 0) {
            const slice = 256;
            const sx = ((camera.x % slice) + slice) % slice;
            const sy = ((camera.y % slice) + slice) % slice;
            for (let y = -sy; y < VH; y += slice) {
              for (let x = -sx; x < VW; x += slice) {
                ctx.drawImage(
                  IMG.dungeon,
                  0,
                  600,
                  slice,
                  slice,
                  x,
                  y,
                  slice,
                  slice,
                );
              }
            }
            ctx.fillStyle = "rgba(13,13,18,0.5)";
            ctx.fillRect(0, 0, VW, VH);
          } else {
            ctx.fillStyle = "#0a0a0e";
            ctx.fillRect(0, 0, VW, VH);
          }
          ctx.strokeStyle = "rgba(80,60,40,0.18)";
          for (let x = -(camera.x % TILE_BG); x < VW; x += TILE_BG) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, VH);
            ctx.stroke();
          }
          for (let y = -(camera.y % TILE_BG); y < VH; y += TILE_BG) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(VW, y);
            ctx.stroke();
          }
        }
        function hpBar(x, y, w, frac, color) {
          ctx.fillStyle = "#000";
          ctx.fillRect(x - w / 2, y, w, 3);
          ctx.fillStyle = color || "#80c850";
          ctx.fillRect(x - w / 2, y, w * Math.max(0, frac), 3);
        }
        function worldX(x) {
          return x - camera.x;
        }
        function worldY(y) {
          return y - camera.y;
        }
        function inView(o, pad = 80) {
          return (
            o.x > camera.x - pad &&
            o.x < camera.x + VW + pad &&
            o.y > camera.y - pad &&
            o.y < camera.y + VH + pad
          );
        }
        function render() {
          drawBg();
          ctx.textAlign = "center";
          const t = performance.now();

          for (const pk of state.pickups) {
            if (!inView(pk)) continue;
            const x = worldX(pk.x),
              y = worldY(pk.y);
            ctx.fillStyle = "#80c850";
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(128,200,80,0.3)";
            ctx.beginPath();
            ctx.arc(x, y, 7 + Math.sin(t / 100) * 2, 0, Math.PI * 2);
            ctx.fill();
          }

          for (const m of state.minions) {
            if (!inView(m)) continue;
            const x = worldX(m.x),
              y = worldY(m.y);
            const sheet =
              m.tint && TINTS[m.tint]
                ? TINTS[m.tint]
                : IMG[m.sheetKey || "skel"];
            const drawn = drawSprite(
              sheet,
              m.facing,
              m.moving ? t : 0,
              x,
              y,
              0.7,
            );
            if (!drawn) {
              ctx.font = "20px serif";
              ctx.fillStyle = m.color || "#c8c0a8";
              ctx.fillText(
                m.kind === "archer"
                  ? "🏹"
                  : m.kind === "mage"
                    ? "🔥"
                    : m.kind === "knight"
                      ? "🛡"
                      : m.kind === "assassin"
                        ? "🗡"
                        : m.kind === "berserker"
                          ? "🪓"
                          : "⚔",
                x,
                y + 6,
              );
            }
            hpBar(x, y - 22, 24, m.hp / m.hpMax, "#80c850");
            ctx.font = "9px monospace";
            ctx.fillStyle = "rgba(216,212,200,0.7)";
            ctx.fillText(m.name.split(" ")[0], x, y - 26);
          }

          for (const e of state.enemies) {
            if (!inView(e)) continue;
            const x = worldX(e.x),
              y = worldY(e.y);
            const sheet =
              e.tint && TINTS[e.tint] ? TINTS[e.tint] : IMG[e.kindKey];
            const drawn = drawSprite(
              sheet,
              e.facing,
              e.moving ? t : 0,
              x,
              y,
              e.scale,
            );
            if (!drawn) {
              ctx.font = (e.scale > 1.2 ? "26px" : "18px") + " serif";
              ctx.fillStyle = e.color;
              ctx.fillText("👹", x, y + 6);
            }
            hpBar(
              x,
              y - 22,
              e.scale > 1.2 ? 60 : 24,
              e.hp / e.hpMax,
              "#c84040",
            );
          }

          {
            const x = worldX(state.player.x),
              y = worldY(state.player.y);
            const sheet = TINTS.malePurple || IMG.male;
            const drawn = drawSprite(
              sheet,
              state.player.facing,
              state.player.moving ? t : 0,
              x,
              y,
              0.95,
            );
            if (!drawn) {
              ctx.font = "28px serif";
              ctx.fillStyle = "#c060c0";
              ctx.fillText("🧙", x, y + 8);
            }
            ctx.strokeStyle = "rgba(192,96,192,0.35)";
            ctx.beginPath();
            ctx.arc(x, y + 4, 26, 0, Math.PI * 2);
            ctx.stroke();
            hpBar(
              x,
              y - 30,
              36,
              state.player.hp / state.player.hpMax,
              "#c060c0",
            );
          }

          for (const p of state.projectiles) {
            if (!inView(p)) continue;
            const x = worldX(p.x),
              y = worldY(p.y);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(160,224,255,0.25)";
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
          }

          for (const f of state.fx) {
            if (f.kind === "nova") {
              const x = worldX(f.x),
                y = worldY(f.y);
              ctx.strokeStyle = `rgba(192,128,255,${f.life / 30})`;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(x, y, f.r, 0, Math.PI * 2);
              ctx.stroke();
              ctx.lineWidth = 1;
            }
          }

          ctx.font = "11px monospace";
          for (const f of state.floats) {
            if (!inView(f)) continue;
            ctx.fillStyle = f.color;
            ctx.globalAlpha = Math.min(1, f.life / 30);
            ctx.fillText(f.text, worldX(f.x), worldY(f.y));
          }
          ctx.globalAlpha = 1;

          ctx.fillStyle = "rgba(200,64,64,0.7)";
          for (const e of state.enemies) {
            if (inView(e, -20)) continue;
            const dx = e.x - state.player.x,
              dy = e.y - state.player.y;
            const ang = Math.atan2(dy, dx);
            const r = Math.min(VW, VH) / 2 - 10;
            const cx = VW / 2 + Math.cos(ang) * r;
            const cy = VH / 2 + Math.sin(ang) * r;
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fill();
          }

          if (!ready) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, VH - 22, VW, 22);
            ctx.fillStyle = "#b89860";
            ctx.font = "12px monospace";
            ctx.fillText(L.loading(loaded, total), VW / 2, VH - 7);
          }
          if (
            state.paused &&
            !document.getElementById("levelup").classList.contains("show")
          ) {
            ctx.fillStyle = "rgba(0,0,0,0.55)";
            ctx.fillRect(0, 0, VW, VH);
            ctx.fillStyle = "#b89860";
            ctx.font = "26px monospace";
            ctx.fillText(L.paused, VW / 2, VH / 2);
          }
          if (state.touch.active) {
            const tx = state.touch.ox,
              ty = state.touch.oy;
            ctx.strokeStyle = "rgba(184,152,96,0.55)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(tx, ty, JOY_MAX, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "rgba(184,152,96,0.85)";
            ctx.beginPath();
            ctx.arc(
              tx + state.touch.dx * JOY_MAX,
              ty + state.touch.dy * JOY_MAX,
              14,
              0,
              Math.PI * 2,
            );
            ctx.fill();
            ctx.lineWidth = 1;
          }
        }

        // ============================================================
        // BOOT
        // ============================================================
        function loop() {
          update();
          render();
          requestAnimationFrame(loop);
        }
        applyI18N();
        document.getElementById("banner").textContent = L.bannerReady;
        log(L.logReady, "#b89860");
        log(L.logHelp, "#8888c8");
        updatePanel();
        loop();
      })();
    </script>
  </body>
</html>
