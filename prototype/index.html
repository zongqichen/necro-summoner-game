<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d12" />
    <title>Necro Summoner — v0.2 Action</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        overscroll-behavior: none;
      }
      body {
        background: #0d0d12;
        color: #d8d4c8;
        font-family: "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        min-height: 100vh;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 4px;
        color: #d8c890;
        text-shadow:
          0 0 10px rgba(184, 152, 96, 0.45),
          0 0 22px rgba(120, 60, 140, 0.25);
      }
      .subtitle {
        font-size: 12px;
        opacity: 0.65;
        margin-bottom: 10px;
        text-align: center;
        color: #b89860;
      }
      #wrap {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        max-width: 100%;
      }
      canvas {
        background: #0a0a0e;
        border: 1px solid #4a3a2a;
        image-rendering: pixelated;
        cursor: crosshair;
        display: block;
        max-width: 100%;
        height: auto;
        touch-action: none;
        box-shadow:
          0 0 0 1px rgba(184, 152, 96, 0.15),
          0 0 30px rgba(80, 30, 100, 0.35),
          inset 0 0 60px rgba(0, 0, 0, 0.6);
      }
      #panel {
        width: 240px;
        background: linear-gradient(180deg, #1a1a26 0%, #14141c 100%);
        border: 1px solid #3a3a4a;
        box-shadow:
          inset 0 1px 0 rgba(184, 152, 96, 0.08),
          0 4px 20px rgba(0, 0, 0, 0.45);
        padding: 12px;
        font-size: 12px;
        line-height: 1.55;
      }
      .stat {
        display: flex;
        justify-content: space-between;
      }
      .stat b {
        color: #b89860;
      }
      hr {
        border: 0;
        border-top: 1px dashed #3a3a4a;
        margin: 8px 0;
      }
      .key {
        display: inline-block;
        background: #2a2a36;
        border: 1px solid #4a4a5a;
        padding: 1px 6px;
        margin: 0 2px;
        font-size: 11px;
      }
      #log {
        height: 130px;
        overflow-y: auto;
        font-size: 11px;
        background: #0d0d12;
        padding: 6px;
        border: 1px solid #3a3a4a;
        margin-top: 6px;
      }
      .banner {
        text-align: center;
        font-size: 14px;
        color: #c84040;
        margin: 6px 0;
        min-height: 18px;
      }
      #levelup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 12px;
      }
      #levelup.show {
        display: flex;
      }
      #levelup .box {
        background: linear-gradient(180deg, #1f1f2a 0%, #14141c 100%);
        border: 2px solid #b89860;
        padding: 20px;
        max-width: 560px;
        width: 100%;
        text-align: center;
        box-shadow:
          0 0 0 1px rgba(184, 152, 96, 0.15),
          0 0 40px rgba(184, 152, 96, 0.25),
          0 12px 40px rgba(0, 0, 0, 0.6);
      }
      #levelup h2 {
        color: #d8c890;
        font-size: 20px;
        margin-bottom: 14px;
        text-shadow: 0 0 12px rgba(184, 152, 96, 0.45);
      }
      #crypt {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 11;
        padding: 12px;
        overflow: auto;
      }
      #crypt.show {
        display: flex;
      }
      #crypt .box {
        background: linear-gradient(180deg, #1f1f2a 0%, #14141c 100%);
        border: 2px solid #b89860;
        padding: 22px 24px;
        max-width: 560px;
        width: 100%;
        box-shadow:
          0 0 0 1px rgba(184, 152, 96, 0.15),
          0 0 50px rgba(184, 152, 96, 0.22),
          0 12px 40px rgba(0, 0, 0, 0.6);
      }
      #crypt h2 {
        color: #d8c890;
        font-size: 20px;
        margin-bottom: 6px;
        text-align: center;
        text-shadow: 0 0 12px rgba(184, 152, 96, 0.45);
      }
      #crypt .runstats {
        font-size: 12px;
        opacity: 0.75;
        text-align: center;
        margin-bottom: 14px;
        line-height: 1.7;
      }
      #crypt .essbar {
        font-size: 13px;
        color: #d8c890;
        text-align: center;
        margin-bottom: 14px;
      }
      #crypt .upgrade {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: #2a2a36;
        border: 1px solid #4a4a5a;
        padding: 10px 12px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      #crypt .upgrade .info b {
        color: #d8c890;
        display: block;
        margin-bottom: 2px;
      }
      #crypt .upgrade .info .desc {
        opacity: 0.75;
        font-size: 11px;
      }
      #crypt .upgrade button {
        background: #b89860;
        color: #16161e;
        border: none;
        padding: 6px 12px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        font-size: 12px;
        white-space: nowrap;
      }
      #crypt .upgrade button:hover {
        background: #d8c890;
      }
      #crypt .upgrade button:disabled {
        background: #3a3a4a;
        color: #6a6a7a;
        cursor: default;
      }
      #crypt .upgrade.maxed .info b {
        color: #80c850;
      }
      #crypt .footer {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      #crypt .footer button {
        flex: 1;
        padding: 10px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        border: 1px solid #b89860;
        background: transparent;
        color: #b89860;
      }
      #crypt .footer button.primary {
        background: #b89860;
        color: #16161e;
        font-weight: bold;
      }
      #crypt .footer button:hover {
        background: #d8c890;
        color: #16161e;
        border-color: #d8c890;
      }
      #levelup .perks {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .perk {
        flex: 1;
        background: #2a2a36;
        border: 1px solid #4a4a5a;
        padding: 14px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1.5;
        text-align: left;
      }
      .perk:hover,
      .perk:active {
        background: #3a3a4a;
        border-color: #b89860;
      }
      .perk b {
        color: #b89860;
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .perk .desc {
        opacity: 0.85;
      }
      .ctrlrow {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .ctrlrow button {
        flex: 1;
        background: #2a2a36;
        color: #d8d4c8;
        border: 1px solid #4a4a5a;
        padding: 8px 4px;
        font-family: inherit;
        cursor: pointer;
        font-size: 11px;
      }
      .ctrlrow button:active {
        background: #3a3a4a;
        border-color: #b89860;
      }
      .langrow {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .langrow button {
        flex: 1;
        background: #2a2a36;
        color: #d8d4c8;
        border: 1px solid #4a4a5a;
        padding: 4px;
        font-family: inherit;
        cursor: pointer;
        font-size: 11px;
      }
      .langrow button.on {
        background: #3a3a4a;
        border-color: #b89860;
        color: #b89860;
      }

      /* ---------- mobile / portrait layout ---------- */
      @media (max-width: 820px) {
        body {
          padding: 6px;
        }
        h1 {
          font-size: 14px;
          letter-spacing: 1px;
        }
        .subtitle {
          font-size: 10px;
          margin-bottom: 4px;
        }
        #wrap {
          flex-direction: column;
          gap: 6px;
          width: 100%;
          align-items: stretch;
        }
        canvas {
          width: 100%;
          max-width: 100vw;
        }
        #panel {
          width: 100%;
        }
        #log {
          height: 70px;
        }
        #levelup .perks {
          flex-direction: column;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <h1>NECRO SUMMONER</h1>
    <div class="subtitle" data-i18n="subtitle"></div>

    <div id="wrap">
      <canvas id="game" width="720" height="480"></canvas>
      <div id="panel">
        <div class="stat">
          <span data-i18n="timeLabel"></span><b id="time">5:00</b>
        </div>
        <div class="stat">
          <span data-i18n="hpLabel"></span><b id="hp">100/100</b>
        </div>
        <div class="stat">
          <span data-i18n="levelLabel"></span><b id="lvl">1 (0/10)</b>
        </div>
        <div class="stat">
          <span data-i18n="soulsLabel"></span><b id="souls">0</b>
        </div>
        <div class="stat">
          <span data-i18n="armyLabel"></span><b id="army">0/3</b>
        </div>
        <div class="stat">
          <span data-i18n="killsLabel"></span><b id="kills">0</b>
        </div>
        <div class="stat">
          <span data-i18n="essenceLabel"></span><b id="essence">0</b>
        </div>
        <hr />
        <div style="font-size: 11px; opacity: 0.7" data-i18n="controls"></div>
        <div>
          <span class="key">WASD</span> / <span class="key">↑↓←→</span>
          <span data-i18n="moveHint"></span>
        </div>
        <div>
          <span data-i18n="autoHint"></span>
          <span style="float: right; color: #8a7a4a" id="cdsummon"></span>
        </div>
        <div>
          <span class="key">Space</span> <span data-i18n="kbPause"></span> ·
          <span class="key">R</span> <span data-i18n="kbRestart"></span> ·
          <span data-i18n="kbTouch"></span>
        </div>
        <div class="ctrlrow">
          <button id="btn-pause" data-i18n="pauseBtn"></button>
          <button id="btn-restart" data-i18n="restartBtn"></button>
        </div>
        <button
          id="btn-crypt"
          data-i18n="cryptBtn"
          style="
            width: 100%;
            margin-top: 6px;
            background: #2a2a36;
            color: #d8c890;
            border: 1px solid #b89860;
            padding: 6px;
            font-family: inherit;
            cursor: pointer;
            font-size: 12px;
          "
        ></button>
        <hr />
        <div style="font-size: 11px; opacity: 0.7" data-i18n="targeting"></div>
        <button
          id="prio"
          style="
            width: 100%;
            background: #2a2a36;
            color: #d8d4c8;
            border: 1px solid #4a4a5a;
            padding: 5px;
            font-family: inherit;
            cursor: pointer;
            font-size: 11px;
            text-align: left;
          "
        ></button>
        <hr />
        <div style="font-size: 11px; opacity: 0.7" data-i18n="langLabel"></div>
        <div class="langrow">
          <button id="lang-en" data-lang="en">EN</button>
          <button id="lang-zh" data-lang="zh">中文</button>
        </div>
        <div class="banner" id="banner"></div>
        <div id="log"></div>
      </div>
    </div>

    <div id="levelup">
      <div class="box">
        <h2 data-i18n="levelupTitle"></h2>
        <div id="perks" class="perks"></div>
      </div>
    </div>

    <div id="crypt">
      <div class="box">
        <h2 data-i18n="cryptTitle"></h2>
        <div class="runstats" id="crypt-runstats"></div>
        <div class="essbar">
          <span data-i18n="essenceLabel"></span>
          <b id="crypt-total">0</b>
        </div>
        <div id="crypt-list"></div>
        <h3
          id="hall-title"
          data-i18n="hallTitle"
          style="
            color: #d8c890;
            font-size: 14px;
            margin: 14px 0 6px;
            text-align: center;
            border-top: 1px dashed #3a3a4a;
            padding-top: 12px;
          "
        ></h3>
        <div
          id="hall-list"
          style="
            font-size: 11px;
            line-height: 1.7;
            max-height: 140px;
            overflow-y: auto;
            color: #b0a890;
            padding: 4px 8px;
            background: #1a1a22;
            border: 1px solid #3a3a4a;
            margin-bottom: 12px;
          "
        ></div>
        <div class="footer">
          <button id="crypt-close" data-i18n="cryptClose"></button>
          <button
            id="crypt-restart"
            class="primary"
            data-i18n="cryptRestart"
          ></button>
        </div>
      </div>
    </div>

        const TINTS = {};

          const c = document.createElement("canvas");

          x.drawImage(src, 0, 0);
          x.globalCompositeOperation = "multiply";
          x.fillStyle = color;
          x.fillRect(0, 0, c.width, c.height);
          x.globalCompositeOperation = "destination-in";
          x.drawImage(src, 0, 0);
          return c;

          if (TINTS.ready || !ready) return;

            return;

        // ============================================================
        // META PROGRESSION (persistent across runs)
        // ============================================================
        // META key uses an explicit schema version. v1 = original (no fallen[]).
        // v2 adds fallen[] for the cross-run Hall of the Fallen. We MUST read
        // v1 first and migrate forward — silently dropping v1 on any parse
        // hiccup would wipe every player's Crypt progress on update.
        const META_KEY_V1 = "necro:meta:v1";
        const META_KEY = "necro:meta:v2";
        const FALLEN_CAP = 30;
        const META_UPGRADES = [
          {
            id: "vigor",
            max: 5,
            costs: [40, 80, 160, 320, 640],
          },
          {
            id: "reaper",
            max: 3,

          { id: "awMage", max: 1, costs: [200] },

        const meta = (() => {
          let data = { essence: 0, levels: {}, lastRun: null, fallen: [] };
          // Try v2 first, then v1. Parse errors are NEVER swallowed into a
          // reset — we keep whatever fields parsed and only blank the rest.
          let raw = null;
          let fromV1 = false;
          try {
            raw = localStorage.getItem(META_KEY);
          } catch (_) {}
          if (!raw) {
            try {
              raw = localStorage.getItem(META_KEY_V1);
              if (raw) fromV1 = true;
            } catch (_) {}
          }
          if (raw) {
            let parsed = null;
            try {
              parsed = JSON.parse(raw);
            } catch (_) {
              parsed = null;
            }
            if (parsed && typeof parsed === "object") {
              data.essence = Math.max(0, parsed.essence | 0);
              data.levels =
                parsed.levels && typeof parsed.levels === "object"
                  ? parsed.levels
                  : {};
              data.lastRun = parsed.lastRun || null;
              data.fallen = Array.isArray(parsed.fallen) ? parsed.fallen : [];
            }
          }
          for (const u of META_UPGRADES) {
            if (typeof data.levels[u.id] !== "number") data.levels[u.id] = 0;
            data.levels[u.id] = Math.max(
              0,
              Math.min(u.max, data.levels[u.id] | 0),
            );
          }
          // Sanitise fallen[] entries — drop anything malformed but keep
          // partial data where possible.
          data.fallen = data.fallen
            .filter((f) => f && typeof f === "object" && f.name)

              name: String(f.name).slice(0, 40),
              kind: String(f.kind || "warrior"),
              kills: Math.max(0, f.kills | 0),
              ageSec: Math.max(0, f.ageSec | 0),
              storyId: f.storyId | 0,
              runIndex: f.runIndex | 0,
            }))
            .slice(-FALLEN_CAP);
          function save() {
            try {
              localStorage.setItem(META_KEY, JSON.stringify(data));
              // Once we've persisted under v2, retire v1 so future loads
              // don't preferentially see the stale copy.
              if (fromV1) {
                try {
                  localStorage.removeItem(META_KEY_V1);
                } catch (_) {}
                fromV1 = false;
              }

          // even before the next awardRun.

            return data.levels[id] | 0;
          }
          function nextCost(id) {
            const u = META_UPGRADES.find((x) => x.id === id);
            const l = lvl(id);
            if (!u || l >= u.max) return null;
            return u.costs[l];
          }

            const c = nextCost(id);
            if (c == null || data.essence < c) return false;
            data.essence -= c;
            data.levels[id] = lvl(id) + 1;
            save();
            return true;

              Math.floor((souls | 0) / 10) + (kills | 0) + (won ? 50 : 0);

            data.lastRun = { souls: souls | 0, gained, won: !!won };

                  name: String(f.name).slice(0, 40),
                  kind: String(f.kind || "warrior"),
                  kills: Math.max(0, f.kills | 0),
                  ageSec: Math.max(0, f.ageSec | 0),
                  storyId: f.storyId | 0,

                data.fallen = data.fallen.slice(-FALLEN_CAP);
              }
            }
            save();
            return gained;
          }

            data.lastRun = null;
            save();
          }

            get essence() {
              return data.essence;

            lvl,
            nextCost,
            buy,
            awardRun,
            clearLastRun,

          // 0–30s : easy intro
          if (elapsed < 30) {
            return r < 0.7 ? ENEMY_KINDS.rat : ENEMY_KINDS.goblin;
          }
          // 30–90s : add bandits
          if (elapsed < 90) {
            if (r < 0.35) return ENEMY_KINDS.rat;
            if (r < 0.65) return ENEMY_KINDS.goblin;
            return ENEMY_KINDS.bandit;
          }
          // 90–180s : wolves + raiders + first shamans
          if (elapsed < 180) {
            if (r < 0.2) return ENEMY_KINDS.bandit;
            if (r < 0.45) return ENEMY_KINDS.wolf;
            if (r < 0.65) return ENEMY_KINDS.raider;
            if (r < 0.8) return ENEMY_KINDS.goblin;
            return ENEMY_KINDS.shaman;
          }
          // 180–270s : specters + ghouls + knights
          if (elapsed < 270) {
            if (r < 0.25) return ENEMY_KINDS.wolf;
            if (r < 0.5) return ENEMY_KINDS.ghoul;
            if (r < 0.7) return ENEMY_KINDS.specter;
            if (r < 0.85) return ENEMY_KINDS.knight;
            return ENEMY_KINDS.shaman;
          }
          // 270s+ : late-game heavy mix
          if (r < 0.3) return ENEMY_KINDS.knight;
          if (r < 0.55) return ENEMY_KINDS.ghoul;
          if (r < 0.75) return ENEMY_KINDS.specter;
          if (r < 0.9) return ENEMY_KINDS.shaman;

        // ============================================================
        // TOUCH JOYSTICK (drag-anywhere on canvas)
        // ============================================================
        const JOY_DEAD = 8; // px
        const JOY_MAX = 48; // px — full speed at this radius
        function canvasPt(e) {
          const r = cv.getBoundingClientRect();
          const t = e.touches && e.touches[0] ? e.touches[0] : e;
          const x = ((t.clientX - r.left) / r.width) * cv.width;
          const y = ((t.clientY - r.top) / r.height) * cv.height;
          return { x, y };
        }
        cv.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            const p = canvasPt(e);
            state.touch.active = true;
            state.touch.ox = p.x;
            state.touch.oy = p.y;
            state.touch.x = p.x;
            state.touch.y = p.y;
            state.touch.dx = 0;
            state.touch.dy = 0;
          },
          { passive: false },
        );
        cv.addEventListener(
          "touchmove",
          (e) => {
            if (!state.touch.active) return;
            e.preventDefault();
            const p = canvasPt(e);
            state.touch.x = p.x;
            state.touch.y = p.y;
            let dx = p.x - state.touch.ox;
            let dy = p.y - state.touch.oy;
            const m = Math.hypot(dx, dy);
            if (m < JOY_DEAD) {
              dx = 0;
              dy = 0;
            } else {
              const norm = Math.min(m, JOY_MAX) / m;
              dx *= norm;
              dy *= norm;
              if (m > JOY_MAX) {
                state.touch.ox = p.x - dx;
                state.touch.oy = p.y - dy;
              }
            }
            state.touch.dx = dx / JOY_MAX;
            state.touch.dy = dy / JOY_MAX;
          },
          { passive: false },
        );
        const endTouch = (e) => {
          if (e) e.preventDefault();
          state.touch.active = false;
          state.touch.dx = 0;
          state.touch.dy = 0;
        };
        cv.addEventListener("touchend", endTouch, { passive: false });
        cv.addEventListener("touchcancel", endTouch, { passive: false });

        function pickSummonKind() {
          const pool = [];
          if (state.unlocked.warrior) pool.push("warrior");
          if (state.unlocked.archer) pool.push("archer");
          if (state.unlocked.mage) pool.push("mage");
          if (state.unlocked.knight) pool.push("knight");
          if (state.unlocked.assassin) pool.push("assassin");
          if (state.unlocked.berserker) pool.push("berserker");
          return pool[Math.floor(Math.random() * pool.length)] || "warrior";
        }
        function autoSummonOne() {
          if (state.minions.length >= state.maxMinions) return false;
          const kind = pickSummonKind();
          const t = MINION_KINDS[kind];
          const id = makeName();
          // Bone Fortress: melee minions summoned WHILE the perk is active
          // also get the +30% hpMax (otherwise back-fills after a death feel
          // like a downgrade vs the original army).
          const hasFortress =
            state.pickedPerks.boneFortress &&
            (t.attack === "melee" || !t.attack);
          const hpMax = hasFortress ? Math.floor(t.hp * 1.3) : t.hp;
          const m = {
            kind,
            ...t,
            hp: hpMax,
            hpMax: hpMax,
            x: state.player.x + (Math.random() - 0.5) * 40,
            y: state.player.y + (Math.random() - 0.5) * 40,
            cd: 0,
            target: null,
            facing: "right",
            moving: false,
            name: id.full,
            storyId: id.storyId,
            kills: 0,
            age: 0, // ticks alive — drives the Survivor Bond ring
          };
          state.minions.push(m);
          log(
            L.logSummon(L.minions[kind], id.full, L.backstories[id.storyId]),
            "#b89860",
          );
          // Push a reveal card so the player actually reads the name and
          // backstory at the moment of summon. Cap depth to 2; older cards
          // get dropped early.
          state.summonQueue.push({
            kind,
            name: id.full,
            story: L.backstories[id.storyId] || "",
            life: 102, // ~1.7s at 60 Hz
            lifeMax: 102,
          });
          if (state.summonQueue.length > 2) {
            state.summonQueue.splice(0, state.summonQueue.length - 2);
          }
          return true;
        }

          {
            id: "boneFortress",
            once: true,
            // Available once army cap has been raised AND there are 3+ live
            // melee minions to feel the bonus immediately.
            available: (s) => {
              if (s.pickedPerks.boneFortress) return false;
              if (s.maxMinions <= 3 + META_THRONE_BONUS) return false;
              const melee = s.minions.filter(
                (m) => m.attack !== "ranged",
              ).length;
              return melee >= 3;

            apply: (s) => {
              s.pickedPerks.boneFortress = true;
              // Apply +30% hpMax to currently live melee minions.
              // Only hpMax — NOT current hp — so the perk doesn't act as
              // a free heal that trivialises the last 60s of the run.
              for (const m of s.minions) {
                if (m.attack === "ranged") continue;
                const newMax = Math.floor(m.hpMax * 1.3);
                m.hpMax = newMax;

                // (no instant heal, but no clipping either).

            available: (s) => {

        function showLevelUp() {

            log(L.logLevelUp(state.level), "#ffe080");
            showLevelUp();

        // ============================================================
        // SPAWNING
        // ============================================================
        function spawnEnemy() {
          const elapsed = GAME_DURATION - state.time;
          const k = pickEnemyKind(elapsed);
          const side = Math.floor(Math.random() * 4);
          let x, y;
          if (side === 0) {
            x = 20;
            y = 20 + Math.random() * (WORLD_H - 40);
          } else if (side === 1) {
            x = WORLD_W - 20;
            y = 20 + Math.random() * (WORLD_H - 40);
          } else if (side === 2) {
            x = 20 + Math.random() * (WORLD_W - 40);
            y = 20;
          } else {
            x = 20 + Math.random() * (WORLD_W - 40);
            y = WORLD_H - 20;
          }
          const scale = 1 + elapsed / 240;
          state.enemies.push({
            ...k,
            hp: Math.floor(k.hp * scale),
            hpMax: Math.floor(k.hp * scale),
            dmg: Math.floor(k.dmg * (0.6 + elapsed / 360)),
            x,
            y,
            cd: 0,
            target: null,
          });
        }
        function spawnBoss() {
          const k = ENEMY_KINDS.boss;
          state.enemies.push({
            ...k,
            hp: k.hp,
            hpMax: k.hp,
            x: clamp(state.player.x + 200, 40, WORLD_W - 40),
            y: clamp(state.player.y + 100, 40, WORLD_H - 40),
            cd: 0,
            target: null,
          });
          state.bossSpawned = true;
          banner(L.bannerBoss, "#c83030");
          log(L.logBossAppear, "#c83030");
        }

        // ============================================================
        // AI / TICK
        // ============================================================
        function pickTargetFor(unit, pool, mode) {
          if (!pool.length) return null;
          let best = null,
            bestKey = Infinity;
          for (const e of pool) {
            if (e.hp <= 0) continue;
            let k;
            if (mode === "weakest") k = e.hp;
            else if (mode === "strongest") k = -e.hp;
            else k = dist(unit, e);
            if (k < bestKey) {
              bestKey = k;
              best = e;
            }
          }
          return best;
        }
        function moveToward(u, tx, ty, sp) {
          const dx = tx - u.x,
            dy = ty - u.y;
          const d = Math.hypot(dx, dy) || 1;
          u.x += (dx / d) * sp;
          u.y += (dy / d) * sp;
          if (Math.abs(dx) > Math.abs(dy)) u.facing = dx > 0 ? "right" : "left";
          else u.facing = dy > 0 ? "down" : "up";
        }
        function updatePlayer() {
          const p = state.player;
          let dx = 0,
            dy = 0;
          if (keys.KeyW || keys.ArrowUp) dy -= 1;
          if (keys.KeyS || keys.ArrowDown) dy += 1;
          if (keys.KeyA || keys.ArrowLeft) dx -= 1;
          if (keys.KeyD || keys.ArrowRight) dx += 1;
          if (state.touch.active) {
            dx += state.touch.dx;
            dy += state.touch.dy;
          }
          const m = Math.hypot(dx, dy);
          p.moving = m > 0.05;
          if (p.moving) {
            const mag = Math.min(1, m);
            const nx = dx / m,
              ny = dy / m;
            p.x += nx * p.speed * mag;
            p.y += ny * p.speed * mag;
            p.x = clamp(p.x, 16, WORLD_W - 16);
            p.y = clamp(p.y, 16, WORLD_H - 16);
            if (Math.abs(dx) >= Math.abs(dy))
              p.facing = dx > 0 ? "right" : "left";
            else p.facing = dy > 0 ? "down" : "up";
          }

          if (p.atkCd > 0) p.atkCd--;

          if (p.atkCd <= 0) {
            const tgt = pickTargetFor(p, state.enemies, state.priority);
            if (tgt && dist(p, tgt) <= p.atkRange) {
              p.atkCd = p.atkCdMax;
              state.projectiles.push({
                x: p.x,
                y: p.y,
                tx: tgt,
                dmg: 8 * state.perks.dmg,
                color: "#a0e0ff",
                speed: 5 * state.perks.projSpeed,
                friendly: true,
                from: "player",
              });
            }
          }

          if (state.perks.hpRegen > 0 && state.tick % 60 === 0) {
            p.hp = Math.min(p.hpMax, p.hp + state.perks.hpRegen);
          }
        }
        function updateMinion(m) {
          if (m.hp <= 0) return;
          m.age++;
          const LEASH = 180;
          if (
            !m.target ||
            m.target.hp <= 0 ||
            dist(m.target, state.player) > LEASH
          ) {
            let best = null,
              bestKey = Infinity;
            for (const e of state.enemies) {
              if (e.hp <= 0) continue;
              if (dist(e, state.player) > LEASH) continue;
              const k =
                state.priority === "weakest"
                  ? e.hp
                  : state.priority === "strongest"
                    ? -e.hp
                    : dist(m, e);
              if (k < bestKey) {
                bestKey = k;
                best = e;
              }
            }
            m.target = best;
          }
          const distFromPlayer = dist(m, state.player);
          let goalX,
            goalY,
            sp = m.speed;
          if (m.target) {
            const dToTgt = dist(m, m.target);
            if (dToTgt > m.range) {
              goalX = m.target.x;
              goalY = m.target.y;
            } else {
              if (m.cd <= 0) {
                m.cd = m.atkCd;
                const dmg = m.dmg * state.perks.dmg;
                if (m.attack === "ranged") {
                  state.projectiles.push({
                    x: m.x,
                    y: m.y,
                    tx: m.target,
                    dmg,
                    color: m.projColor || "#a8ff90",
                    speed: (m.projSpeed || 5) * state.perks.projSpeed,
                    friendly: true,
                    from: "minion",
                    owner: m, // credits the kill back to this minion
                  });
                  // Ethereal Volley: archers fork a second projectile at
                  // ±20° spread when the synergy perk is taken.
                  if (state.pickedPerks.etherealVolley && m.kind === "archer") {
                    const dx = m.target.x - m.x;
                    const dy = m.target.y - m.y;
                    const ang = Math.atan2(dy, dx) + (20 * Math.PI) / 180;
                    const dlen = Math.hypot(dx, dy) || 1;
                    const fakeTx = {
                      x: m.x + Math.cos(ang) * dlen,
                      y: m.y + Math.sin(ang) * dlen,
                      hp: 1,
                    };
                    state.projectiles.push({
                      x: m.x,
                      y: m.y,
                      tx: m.target, // still homes on the same target
                      dmg: dmg * 0.7,
                      color: m.projColor || "#a8ff90",
                      speed: (m.projSpeed || 5) * state.perks.projSpeed,
                      friendly: true,
                      from: "minion",
                      owner: m,
                    });
                  }
                  // Mage gets a visible nova ring at the cast site so the
                  // class reads as categorically different from warrior.
                  if (m.kind === "mage") {
                    state.fx.push({
                      kind: "nova",
                      x: m.x,
                      y: m.y,
                      r: 0,
                      rMax: 40,
                      life: 30,
                      lifeMax: 30,
                    });
                  }
                } else {
                  const wasAlive = m.target.hp > 0;
                  m.target.hp -= dmg;
                  if (wasAlive && m.target.hp <= 0) {
                    m.target._lastHitBy = m;
                  } else if (wasAlive) {
                    m.target._lastHitBy = m;
                  }
                  float(
                    m.target.x,
                    m.target.y,
                    "-" + Math.floor(dmg),
                    "#ff8080",
                  );
                }
              }
              m.moving = false;
              if (m.cd > 0) m.cd--;
              return;
            }
          } else {
            const orbitR = 56;
            if (m.orbitAng === undefined)
              m.orbitAng = Math.random() * Math.PI * 2;
            m.orbitAng += 0.015;
            goalX = state.player.x + Math.cos(m.orbitAng) * orbitR;
            goalY = state.player.y + Math.sin(m.orbitAng) * orbitR;
          }
          if (distFromPlayer > 140) sp *= 1.6;
          moveToward(m, goalX, goalY, sp);
          m.moving = true;
          if (m.cd > 0) m.cd--;
        }
        function updateEnemy(e) {
          if (e.hp <= 0) return;
          let tgt = state.player;
          let bestD = dist(e, state.player);
          for (const m of state.minions) {
            if (m.hp <= 0) continue;
            const d = dist(e, m);
            if (d < bestD) {
              bestD = d;
              tgt = m;
            }
          }
          e.target = tgt;
          if (bestD > e.range) {
            moveToward(e, tgt.x, tgt.y, e.speed);
            e.moving = true;
          } else {
            e.moving = false;
            if (e.cd <= 0) {
              e.cd = e.atkCd;
              if (e.attack === "ranged") {
                state.projectiles.push({
                  x: e.x,
                  y: e.y,
                  tx: tgt,
                  dmg: e.dmg,
                  color: e.projColor || "#ff80ff",
                  speed: e.projSpeed || 4,
                  friendly: false,
                  from: "enemy",
                });
              } else {
                tgt.hp -= e.dmg;
                float(tgt.x, tgt.y, "-" + e.dmg, "#ffaa44");
              }
            }
          }
          if (e.cd > 0) e.cd--;
        }
        function updateProjectile(p) {
          if (!p.tx || p.tx.hp <= 0) {
            p.dead = true;
            return;
          }
          if (!p.trail) p.trail = [];
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 6) p.trail.shift();
          const dx = p.tx.x - p.x,
            dy = p.tx.y - p.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 6) {
            const wasAlive = p.tx.hp > 0;
            p.tx.hp -= p.dmg;
            // Credit the kill to the originating minion if any. The enemy
            // filter reads _lastHitBy to bump m.kills.
            if (wasAlive && p.friendly && p.owner && p.owner.hp > 0) {
              p.tx._lastHitBy = p.owner;
            }
            float(
              p.tx.x,
              p.tx.y,
              "-" + Math.floor(p.dmg),
              p.friendly ? "#ff8080" : "#ffaa44",
            );
            p.dead = true;
            return;
          }
          p.x += (dx / d) * p.speed;
          p.y += (dy / d) * p.speed;
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        function update() {
          if (state.paused || state.over) return;
          state.tick++;

          if (state.tick % 60 === 0) state.time = Math.max(0, state.time - 1);
          if (state.time <= 0 && !state.bossSpawned) spawnBoss();

          updatePlayer();

          if (state.minions.length < state.maxMinions) {
            state.autoSummonCd--;
            if (state.autoSummonCd <= 0) {
              if (autoSummonOne()) {
                state.autoSummonCd =
                  state.autoSummonCdMax * state.perks.summonCdMul;
              } else {
                state.autoSummonCd = 30;
              }
            }
          } else {
            state.autoSummonCd = Math.min(
              state.autoSummonCd,
              state.autoSummonCdMax * state.perks.summonCdMul,
            );
          }

          if (!state.bossSpawned) {
            state.spawnCd--;
            if (state.spawnCd <= 0) {
              const elapsed = GAME_DURATION - state.time;
              const rate = Math.max(14, 60 - elapsed * 0.14);
              state.spawnCd = rate;
              const batch = 1 + Math.floor(elapsed / 90);
              const cap = 30;
              for (let i = 0; i < batch; i++) {
                if (state.enemies.length >= cap) break;
                spawnEnemy();
              }
            }
          }

          // Hit-stop guard: ONLY pauses unit/projectile motion. Embers,
          // soul-magnet, fx tick, spawn cooldowns, and summon timers all
          // keep ticking — otherwise a 12-tick boss freeze (200 ms) makes
          // ember drift and magnet pull visibly stutter.
          const moving = state.hitstop <= 0;
          if (moving) {
            for (const m of state.minions) updateMinion(m);
            for (const e of state.enemies) updateEnemy(e);
            for (const p of state.projectiles) updateProjectile(p);
          }
          if (state.hitstop > 0) state.hitstop--;
          if (state.shake > 0) state.shake *= 0.85;
          if (state.shake < 0.2) state.shake = 0;

          // Tick down summon-reveal cards regardless of hit-stop.
          for (const card of state.summonQueue) card.life--;
          state.summonQueue = state.summonQueue.filter((c) => c.life > 0);

          state.enemies = state.enemies.filter((e) => {
            if (e.hp <= 0) {
              state.kills++;
              gainXp(e.soul);
              // Credit the killing blow to the responsible minion (if any)
              // — this is what makes the death-log epitaph mean something.
              if (e._lastHitBy && e._lastHitBy.hp > 0) {
                e._lastHitBy.kills++;
              }
              state.pickups.push({
                x: e.x,
                y: e.y,
                kind: "soul",
                value: e.soul,
              });
              float(e.x, e.y - 10, "+" + e.soul + "xp", "#ffe080");
              // Hit-stop + screen-shake on every kill. Only motion is paused
              // (see update() guard) — embers/fx/magnet keep ticking.
              const isBoss = e.kindId === "boss";
              state.hitstop = Math.max(state.hitstop, isBoss ? 12 : 3);
              state.shake = Math.min(
                24,
                state.shake + (isBoss ? 18 : 2.5 * (e.scale || 1)),
              );
              const burstN = isBoss ? 22 : 7;
              const burstColor = e.color || "#c84040";
              for (let i = 0; i < burstN; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = 1 + Math.random() * 2.5;
                state.fx.push({
                  kind: "burst",
                  x: e.x,
                  y: e.y,
                  dx: Math.cos(ang) * sp,
                  dy: Math.sin(ang) * sp - 0.5,
                  life: 24 + Math.floor(Math.random() * 10),
                  lifeMax: 30,
                  color: burstColor,
                });
              }
              if (isBoss) {
                state.won = true;
                state.over = true;
                banner(L.bannerVictory, "#80c850");
                log(L.logVictory, "#80c850");
                finishRun(true);
              }
              return false;
            }
            return true;
          });
          state.minions = state.minions.filter((m) => {
            if (m.hp <= 0) {
              const ageSec = Math.floor(m.age / TICK_HZ);
              const epitaph = L.epitaphTier ? L.epitaphTier(m.kills | 0) : "";
              log(
                L.logMinionDeath(
                  m.name,
                  L.backstories[m.storyId] || "",
                  m.kills,
                  ageSec,
                  epitaph,
                ),
                "#a86060",
              );
              float(m.x, m.y, "☠ " + m.name, "#a86060");
              // Within-run record so the Run Summary / Hall has data even
              // before the run ends. Drained into meta.fallen via finishRun.
              state.fallenThisRun.push({
                name: m.name,
                kind: m.kind,
                kills: m.kills | 0,
                ageSec,
                storyId: m.storyId | 0,
              });
              // Soul Tide: any minion death + perk taken → permanent run-wide
              // dmg bump on state.perks.dmg, capped at 5 stacks.
              if (state.pickedPerks.soulTide && state.soulTideStacks < 5) {
                state.perks.dmg *= 1.05;
                state.soulTideStacks++;
              }
              return false;
            }
            return true;
          });
          state.projectiles = state.projectiles.filter((p) => !p.dead);
          state.fx = state.fx.filter((f) => {
            f.life--;
            if (f.kind === "nova") f.r = f.rMax * (1 - f.life / 30);
            if (f.kind === "burst") {
              f.x += f.dx;
              f.y += f.dy;
              f.dy += 0.08;
              f.dx *= 0.94;
              f.dy *= 0.94;
            }
            return f.life > 0;
          });
          state.floats = state.floats.filter((f) => {
            f.life--;
            f.y -= 0.6;
            return f.life > 0;
          });

          for (const pk of state.pickups) {
            const d = dist(pk, state.player);
            if (d < state.perks.soulMagnet) {
              const dx = state.player.x - pk.x,
                dy = state.player.y - pk.y;
              const m = Math.hypot(dx, dy) || 1;
              const sp = Math.max(2, 6 - d / 30);
              pk.x += (dx / m) * sp;
              pk.y += (dy / m) * sp;
            }
            if (d < 18) {
              pk.dead = true;
              state.souls += pk.value;
            }
          }
          state.pickups = state.pickups.filter((p) => !p.dead);

          if (state.player.hp <= 0 && !state.over) {
            state.over = true;
            banner(L.bannerDeath, "#c83030");
            log(L.logDeath, "#c83030");
            finishRun(false);
          }

          camera.x = clamp(state.player.x - VW / 2, 0, WORLD_W - VW);
          camera.y = clamp(state.player.y - VH / 2, 0, WORLD_H - VH);

          updatePanel();
        }

        function updatePanel() {
          const m = Math.floor(state.time / 60),
            s = state.time % 60;
          document.getElementById("time").textContent =
            `${m}:${s.toString().padStart(2, "0")}`;
          document.getElementById("hp").textContent =
            `${Math.max(0, Math.ceil(state.player.hp))}/${state.player.hpMax}`;
          document.getElementById("lvl").textContent =
            `${state.level} (${state.xp}/${state.xpNext})`;
          document.getElementById("souls").textContent = state.souls;
          document.getElementById("army").textContent =
            `${state.minions.length}/${state.maxMinions}`;
          document.getElementById("kills").textContent = state.kills;
          const essEl = document.getElementById("essence");
          if (essEl) essEl.textContent = meta.essence;
          const cdEl = document.getElementById("cdsummon");
          if (cdEl) {
            if (state.minions.length >= state.maxMinions) {
              cdEl.textContent = L.armyFull;
            } else {
              cdEl.textContent = L.summonIn(
                (state.autoSummonCd / 60).toFixed(1),
              );
            }
          }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function drawBg() {
          ensureTints();
          if (ready && IMG.dungeon.complete && IMG.dungeon.naturalWidth > 0) {
            const slice = 256;
            const sx = ((camera.x % slice) + slice) % slice;
            const sy = ((camera.y % slice) + slice) % slice;
            for (let y = -sy; y < VH; y += slice) {
              for (let x = -sx; x < VW; x += slice) {
                ctx.drawImage(
                  IMG.dungeon,
                  0,
                  0,
                  slice,
                  slice,
                  x,
                  y,
                  slice,
                  slice,
                );
              }
            }
            ctx.fillStyle = "rgba(13,13,18,0.5)";
            ctx.fillRect(0, 0, VW, VH);
          } else {
            ctx.fillStyle = "#0a0a0e";
            ctx.fillRect(0, 0, VW, VH);
          }
          ctx.strokeStyle = "rgba(80,60,40,0.18)";
          for (let x = -(camera.x % TILE_BG); x < VW; x += TILE_BG) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, VH);
            ctx.stroke();
          }
          for (let y = -(camera.y % TILE_BG); y < VH; y += TILE_BG) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(VW, y);
            ctx.stroke();
          }
        }
        function drawEmbers(t) {
          if (state.embers.length < 28) {
            for (let i = state.embers.length; i < 28; i++) {
              state.embers.push({
                x: Math.random() * VW,
                y: Math.random() * VH,
                vy: -(0.15 + Math.random() * 0.35),
                vx: (Math.random() - 0.5) * 0.15,
                r: 0.6 + Math.random() * 1.4,
                phase: Math.random() * Math.PI * 2,
                hue: Math.random() < 0.5 ? "#b89860" : "#a060c0",
              });
            }
          }
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (const em of state.embers) {
            em.x += em.vx;
            em.y += em.vy;
            em.phase += 0.04;
            if (em.y < -4) {
              em.y = VH + 4;
              em.x = Math.random() * VW;
            }
            if (em.x < -4) em.x = VW + 4;
            else if (em.x > VW + 4) em.x = -4;
            const a = 0.25 + Math.sin(em.phase) * 0.15;
            ctx.fillStyle = em.hue;
            ctx.globalAlpha = Math.max(0, a);
            ctx.beginPath();
            ctx.arc(em.x, em.y, em.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.restore();
        }
        function drawVignette() {
          const g = ctx.createRadialGradient(
            VW / 2,
            VH / 2,
            Math.min(VW, VH) * 0.35,
            VW / 2,
            VH / 2,
            Math.max(VW, VH) * 0.75,
          );
          g.addColorStop(0, "rgba(0,0,0,0)");
          g.addColorStop(0.7, "rgba(0,0,0,0.35)");
          g.addColorStop(1, "rgba(0,0,0,0.75)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, VW, VH);
        }
        function dropShadow(x, y, w) {
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.beginPath();
          ctx.ellipse(x, y + 14, w, w * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        function drawFixedHud() {
          const pad = 10;
          const barH = 14;
          const hpW = Math.min(220, Math.floor(VW * 0.32));
          const hpX = pad;
          const hpY = pad;
          const hpFrac = Math.max(
            0,
            Math.min(1, state.player.hp / state.player.hpMax),
          );
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(hpX - 2, hpY - 2, hpW + 4, barH + 4);
          ctx.fillStyle = "#1a0c10";
          ctx.fillRect(hpX, hpY, hpW, barH);
          const hpGrad = ctx.createLinearGradient(hpX, hpY, hpX + hpW, hpY);
          hpGrad.addColorStop(0, "#c83040");
          hpGrad.addColorStop(1, "#f08070");
          ctx.fillStyle = hpGrad;
          ctx.fillRect(hpX, hpY, hpW * hpFrac, barH);
          ctx.strokeStyle = "rgba(184,152,96,0.55)";
          ctx.lineWidth = 1;
          ctx.strokeRect(hpX + 0.5, hpY + 0.5, hpW - 1, barH - 1);
          ctx.font = "bold 11px monospace";
          ctx.textAlign = "left";
          ctx.fillStyle = "rgba(0,0,0,0.85)";
          const hpText = `HP ${Math.max(0, Math.ceil(state.player.hp))} / ${state.player.hpMax}`;
          ctx.fillText(hpText, hpX + 7, hpY + barH - 3);
          ctx.fillStyle = "#ffe8c8";
          ctx.fillText(hpText, hpX + 6, hpY + barH - 4);

          const xpW = Math.min(220, Math.floor(VW * 0.32));
          const xpX = VW - pad - xpW;
          const xpY = pad;
          const xpFrac = Math.max(
            0,
            Math.min(1, state.xp / Math.max(1, state.xpNext)),
          );
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(xpX - 2, xpY - 2, xpW + 4, barH + 4);
          ctx.fillStyle = "#0c1018";
          ctx.fillRect(xpX, xpY, xpW, barH);
          const xpGrad = ctx.createLinearGradient(xpX, xpY, xpX + xpW, xpY);
          xpGrad.addColorStop(0, "#7060c0");
          xpGrad.addColorStop(1, "#c8a0ff");
          ctx.fillStyle = xpGrad;
          ctx.fillRect(xpX, xpY, xpW * xpFrac, barH);
          ctx.strokeStyle = "rgba(184,152,96,0.55)";
          ctx.lineWidth = 1;
          ctx.strokeRect(xpX + 0.5, xpY + 0.5, xpW - 1, barH - 1);
          ctx.textAlign = "right";
          const xpText = `LV ${state.level}  ${state.xp}/${state.xpNext}`;
          ctx.fillStyle = "rgba(0,0,0,0.85)";
          ctx.fillText(xpText, xpX + xpW - 5, xpY + barH - 3);
          ctx.fillStyle = "#ffe8c8";
          ctx.fillText(xpText, xpX + xpW - 6, xpY + barH - 4);

          const m = Math.floor(state.time / 60),
            s = state.time % 60;
          const tStr = `${m}:${s.toString().padStart(2, "0")}`;
          ctx.font = "bold 16px monospace";
          ctx.textAlign = "center";
          ctx.fillStyle = "rgba(0,0,0,0.75)";
          ctx.fillText(tStr, VW / 2 + 1, pad + 14);
          ctx.fillStyle = state.time <= 30 ? "#ff8060" : "#d8c890";
          ctx.fillText(tStr, VW / 2, pad + 13);

          ctx.lineWidth = 1;
          ctx.textAlign = "center";
        }
        function hpBar(x, y, w, frac, color) {
          ctx.fillStyle = "rgba(0,0,0,0.85)";
          ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, 5);
          ctx.fillStyle = "#1a1a22";
          ctx.fillRect(x - w / 2, y, w, 3);
          const grad = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y);
          const base = color || "#80c850";
          grad.addColorStop(0, base);
          grad.addColorStop(1, "#ffffff22");
          ctx.fillStyle = grad;
          ctx.fillRect(x - w / 2, y, w * Math.max(0, frac), 3);
        }
        function worldX(x) {
          return x - camera.x;
        }
        function worldY(y) {
          return y - camera.y;
        }
        function inView(o, pad = 80) {
          return (
            o.x > camera.x - pad &&
            o.x < camera.x + VW + pad &&
            o.y > camera.y - pad &&
            o.y < camera.y + VH + pad
          );
        }
        function render() {
          // Screen shake — translate the whole world frame, but NOT the HUD
          // (which is drawn after the matching restore). The shake is also
          // applied to drawBg so the dungeon tiles wobble with the impact.
          const shakeX =
            state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
          const shakeY =
            state.shake > 0 ? (Math.random() - 0.5) * state.shake : 0;
          ctx.save();
          if (shakeX || shakeY) ctx.translate(shakeX, shakeY);
          drawBg();
          drawEmbers(performance.now());
          ctx.textAlign = "center";
          const t = performance.now();

          for (const pk of state.pickups) {
            if (!inView(pk)) continue;
            const x = worldX(pk.x),
              y = worldY(pk.y);
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            const halo = ctx.createRadialGradient(x, y, 0, x, y, 14);
            halo.addColorStop(0, "rgba(180,255,140,0.55)");
            halo.addColorStop(1, "rgba(128,200,80,0)");
            ctx.fillStyle = halo;
            const pulse = 10 + Math.sin(t / 200) * 3;
            ctx.beginPath();
            ctx.arc(x, y, pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.fillStyle = "#d8ffa0";
            ctx.beginPath();
            ctx.arc(x, y, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }

          for (const m of state.minions) {
            if (!inView(m)) continue;
            const x = worldX(m.x),
              y = worldY(m.y);
            dropShadow(x, y, 11);
            // Survivor Bond age-ring: rendered BEFORE the sprite so it
            // sits beneath. Tiers fire on real-time seconds (m.age is in
            // 60 Hz logical ticks, not rAF frames — so this is monitor-rate
            // independent).
            const ageSec = m.age / TICK_HZ;
            if (ageSec >= 30) {
              const ringR = 16;
              let ringAlpha = 0.35;
              let ringColor = "#d8d4c8";
              if (ageSec >= 90) {
                ringColor = "#ffd060";
                ringAlpha = 0.7;
              } else if (ageSec >= 60) {
                ringAlpha = 0.55;
              }
              ctx.save();
              ctx.strokeStyle = ringColor;
              ctx.globalAlpha = ringAlpha;
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.arc(x, y, ringR, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
              if (ageSec >= 90) {
                ctx.font = "10px monospace";
                ctx.fillStyle = "#ffd060";
                ctx.textAlign = "center";
                ctx.fillText("★", x, y - 32);
              }
            }
            const sheet =
              m.tint && TINTS[m.tint]
                ? TINTS[m.tint]
                : IMG[m.sheetKey || "skel"];
            const drawn = drawSprite(
              sheet,
              m.facing,
              m.moving ? t : 0,
              x,
              y,
              0.7,
            );
            if (!drawn) {
              ctx.font = "20px serif";
              ctx.fillStyle = m.color || "#c8c0a8";
              ctx.fillText(
                m.kind === "archer"
                  ? "🏹"
                  : m.kind === "mage"
                    ? "🔥"
                    : m.kind === "knight"
                      ? "🛡"
                      : m.kind === "assassin"
                        ? "🗡"
                        : m.kind === "berserker"
                          ? "🪓"
                          : "⚔",
                x,
                y + 6,
              );
            }
            hpBar(x, y - 22, 24, m.hp / m.hpMax, "#80c850");
            ctx.font = "9px monospace";
            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillText(m.name.split(" ")[0], x + 1, y - 25);
            ctx.fillStyle = "rgba(232,224,200,0.9)";
            ctx.fillText(m.name.split(" ")[0], x, y - 26);
          }

          for (const e of state.enemies) {
            if (!inView(e)) continue;
            const x = worldX(e.x),
              y = worldY(e.y);
            dropShadow(x, y, e.scale > 1.2 ? 22 : 11);
            const sheet =
              e.tint && TINTS[e.tint] ? TINTS[e.tint] : IMG[e.kindKey];
            const drawn = drawSprite(
              sheet,
              e.facing,
              e.moving ? t : 0,
              x,
              y,
              e.scale,
            );
            if (!drawn) {
              ctx.font = (e.scale > 1.2 ? "26px" : "18px") + " serif";
              ctx.fillStyle = e.color;
              ctx.fillText("👹", x, y + 6);
            }
            hpBar(
              x,
              y - 22,
              e.scale > 1.2 ? 60 : 24,
              e.hp / e.hpMax,
              "#c84040",
            );
          }

          {
            const x = worldX(state.player.x),
              y = worldY(state.player.y);
            dropShadow(x, y, 14);
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            const pulse = 22 + Math.sin(t / 280) * 4;
            const aura = ctx.createRadialGradient(x, y + 4, 4, x, y + 4, pulse);
            aura.addColorStop(0, "rgba(200,120,220,0.5)");
            aura.addColorStop(0.6, "rgba(140,80,180,0.2)");
            aura.addColorStop(1, "rgba(80,30,120,0)");
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(x, y + 4, pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            const sheet = TINTS.malePurple || IMG.male;
            const drawn = drawSprite(
              sheet,
              state.player.facing,
              state.player.moving ? t : 0,
              x,
              y,
              0.95,
            );
            if (!drawn) {
              ctx.font = "28px serif";
              ctx.fillStyle = "#c060c0";
              ctx.fillText("🧙", x, y + 8);
            }
            hpBar(
              x,
              y - 30,
              36,
              state.player.hp / state.player.hpMax,
              "#c060c0",
            );
          }

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (const p of state.projectiles) {
            if (!inView(p)) continue;
            if (p.trail) {
              for (let i = 0; i < p.trail.length; i++) {
                const tp = p.trail[i];
                const a = (i + 1) / p.trail.length;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = a * 0.45;
                ctx.beginPath();
                ctx.arc(worldX(tp.x), worldY(tp.y), 2.4 * a, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.globalAlpha = 1;
            }
            const x = worldX(p.x),
              y = worldY(p.y);
            const glow = ctx.createRadialGradient(x, y, 0, x, y, 9);
            glow.addColorStop(0, p.color);
            glow.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(x, y, 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          for (const f of state.fx) {
            if (f.kind === "nova") {
              const x = worldX(f.x),
                y = worldY(f.y);
              ctx.strokeStyle = `rgba(192,128,255,${f.life / 30})`;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(x, y, f.r, 0, Math.PI * 2);
              ctx.stroke();
              ctx.lineWidth = 1;
            } else if (f.kind === "burst") {
              const x = worldX(f.x),
                y = worldY(f.y);
              const a = Math.max(0, f.life / (f.lifeMax || 30));
              ctx.save();
              ctx.globalCompositeOperation = "lighter";
              ctx.fillStyle = f.color;
              ctx.globalAlpha = a;
              ctx.beginPath();
              ctx.arc(x, y, 1.6 + a * 1.6, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
              ctx.globalAlpha = 1;
            }
          }

          ctx.font = "11px monospace";
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(0,0,0,0.75)";
          for (const f of state.floats) {
            if (!inView(f)) continue;
            const fx = worldX(f.x),
              fy = worldY(f.y);
            ctx.globalAlpha = Math.min(1, f.life / 30);
            ctx.strokeText(f.text, fx, fy);
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, fx, fy);
          }
          ctx.globalAlpha = 1;
          ctx.lineWidth = 1;

          drawVignette();

          ctx.restore(); // end shake transform — HUD draws unmoved

          ctx.fillStyle = "rgba(200,64,64,0.7)";
          for (const e of state.enemies) {
            if (inView(e, -20)) continue;
            const dx = e.x - state.player.x,
              dy = e.y - state.player.y;
            const ang = Math.atan2(dy, dx);
            const r = Math.min(VW, VH) / 2 - 10;
            const cx = VW / 2 + Math.cos(ang) * r;
            const cy = VH / 2 + Math.sin(ang) * r;
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fill();
          }

          drawFixedHud();

          // ----------------------------------------------------------------
          // Summon Reveal Card — slides in at top-center for newly-summoned
          // minions so the name + backstory actually register at the moment
          // of birth (the log line scrolls past unread mid-combat).
          // Skipped while the touch joystick is active; the joystick is
          // drag-anywhere, so any fixed placement risks overlap on mobile.
          // ----------------------------------------------------------------
          if (state.summonQueue.length && !state.touch.active) {
            const card = state.summonQueue[0];
            const cardW = Math.min(280, Math.floor(VW * 0.7));
            const cardH = 44;
            // Slide-in: ease over the first 12 ticks, hold, ease out last 12.
            const t01 = 1 - card.life / card.lifeMax;
            let slideY = 0;
            if (t01 < 0.12) {
              slideY = (1 - t01 / 0.12) * -cardH;
            } else if (card.life < 12) {
              slideY = (1 - card.life / 12) * -cardH;
            }
            const cx = VW / 2 - cardW / 2;
            const cy = 36 + slideY;
            ctx.save();
            ctx.fillStyle = "rgba(13,13,18,0.85)";
            ctx.fillRect(cx, cy, cardW, cardH);
            ctx.strokeStyle = "rgba(184,152,96,0.5)";
            ctx.lineWidth = 1;
            ctx.strokeRect(cx + 0.5, cy + 0.5, cardW - 1, cardH - 1);
            ctx.textAlign = "left";
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = "#d8c890";
            const label = (L.minions && L.minions[card.kind]) || card.kind;
            ctx.fillText(`${label} · ${card.name}`, cx + 8, cy + 17);
            ctx.font = "italic 10px monospace";
            ctx.fillStyle = "rgba(184,152,96,0.85)";
            // truncate long stories so they fit one line
            let story = card.story || "";
            const maxChars = Math.floor(cardW / 5.4);
            if (story.length > maxChars) {
              story = story.slice(0, maxChars - 1) + "…";
            }
            ctx.fillText(story, cx + 8, cy + 33);
            ctx.restore();
          }

          if (!ready) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, VH - 22, VW, 22);
            ctx.fillStyle = "#b89860";
            ctx.font = "12px monospace";
            ctx.fillText(L.loading(loaded, total), VW / 2, VH - 7);
          }
          if (
            state.paused &&
            !document.getElementById("levelup").classList.contains("show") &&
            !document.getElementById("crypt").classList.contains("show")
          ) {
            ctx.fillStyle = "rgba(0,0,0,0.55)";
            ctx.fillRect(0, 0, VW, VH);
            ctx.fillStyle = "#b89860";
            ctx.font = "26px monospace";
            ctx.fillText(L.paused, VW / 2, VH / 2);
          }
          if (state.touch.active) {
            const tx = state.touch.ox,
              ty = state.touch.oy;
            ctx.strokeStyle = "rgba(184,152,96,0.55)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(tx, ty, JOY_MAX, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "rgba(184,152,96,0.85)";
            ctx.beginPath();
            ctx.arc(
              tx + state.touch.dx * JOY_MAX,
              ty + state.touch.dy * JOY_MAX,
              14,
              0,
              Math.PI * 2,
            );
            ctx.fill();
            ctx.lineWidth = 1;
          }
        }

        // ============================================================
        // BOOT
        // ============================================================
        // Fixed-timestep game loop driven by wall-clock time.
        // Without this, state.tick advances once per rAF — so on 120 Hz
        // monitors the 5-min run finishes in 2.5 min, enemies spawn 2x as
        // fast, and the emotional-arc pacing is destroyed. update() now runs
        // at exactly 60 logical ticks per real second regardless of refresh.
        const TICK_HZ = 60;
        const TICK_MS = 1000 / TICK_HZ;
        const MAX_CATCHUP = 8; // cap update() catchup steps per frame
        let _lastFrame = 0;
        let _accum = 0;
        function loop(now) {
          if (!_lastFrame) _lastFrame = now;
          let dt = now - _lastFrame;
          _lastFrame = now;
          if (dt > 250) dt = 250; // tab-throttle / breakpoint guard
          _accum += dt;
          let steps = 0;
          while (_accum >= TICK_MS && steps < MAX_CATCHUP) {
            update();
            _accum -= TICK_MS;
            steps++;
          }
          if (steps >= MAX_CATCHUP) _accum = 0; // drop excess
          render();
          requestAnimationFrame(loop);
        }
        applyI18N();
        document.getElementById("banner").textContent = L.bannerReady;
        log(L.logReady, "#b89860");
        log(L.logHelp, "#8888c8");
        updatePanel();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
