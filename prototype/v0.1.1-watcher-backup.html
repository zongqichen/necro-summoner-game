<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Necro Summoner — Prototype v0.1</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0d0d12;
        color: #d8d4c8;
        font-family: "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        min-height: 100vh;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 2px;
        margin-bottom: 4px;
        color: #b89860;
      }
      .subtitle {
        font-size: 12px;
        opacity: 0.5;
        margin-bottom: 12px;
      }
      #wrap {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      canvas {
        background: #1a1a22;
        border: 1px solid #3a3a4a;
        image-rendering: pixelated;
      }
      #panel {
        width: 220px;
        background: #16161e;
        border: 1px solid #3a3a4a;
        padding: 12px;
        font-size: 12px;
        line-height: 1.6;
      }
      .stat {
        display: flex;
        justify-content: space-between;
      }
      .stat b {
        color: #b89860;
      }
      hr {
        border: 0;
        border-top: 1px dashed #3a3a4a;
        margin: 8px 0;
      }
      button {
        width: 100%;
        background: #2a2a36;
        color: #d8d4c8;
        border: 1px solid #4a4a5a;
        padding: 6px 8px;
        margin: 3px 0;
        font-family: inherit;
        cursor: pointer;
        text-align: left;
        font-size: 12px;
      }
      button:hover:not(:disabled) {
        background: #3a3a4a;
        border-color: #b89860;
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .cost {
        float: right;
        color: #8a7a4a;
      }
      #log {
        height: 110px;
        overflow-y: auto;
        font-size: 11px;
        background: #0d0d12;
        padding: 6px;
        border: 1px solid #3a3a4a;
        margin-top: 8px;
      }
      #log div {
        opacity: 0.85;
      }
      .wave-banner {
        color: #c84040;
        font-size: 13px;
        text-align: center;
        margin: 8px 0;
      }
      #status {
        font-size: 11px;
        opacity: 0.6;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>NECRO SUMMONER</h1>
    <div class="subtitle">prototype v0.1.1 — LPC + FLARE 美术整合</div>
    <div id="wrap">
      <canvas id="game" width="720" height="420"></canvas>
      <div id="panel">
        <div class="stat"><span>魂魄 Souls</span><b id="souls">0</b></div>
        <div class="stat"><span>波次 Wave</span><b id="wave">1 / 5</b></div>
        <div class="stat"><span>军团 Army</span><b id="army">0</b></div>
        <hr />
        <div style="font-size: 11px; opacity: 0.7; margin-bottom: 4px">
          召唤（点击）
        </div>
        <button id="sum-warrior">
          ⚔ 骷髅战士 <span class="cost">10</span>
        </button>
        <button id="sum-archer">
          🏹 骷髅弓手 <span class="cost">15</span>
        </button>
        <button id="sum-mage">🔥 骷髅法师 <span class="cost">25</span></button>
        <hr />
        <div style="font-size: 11px; opacity: 0.7">阵型 / 优先级</div>
        <button id="prio">优先：最近的敌人</button>
        <div class="wave-banner" id="banner"></div>
        <div id="log"></div>
        <div id="status">空格暂停 · R 重开</div>
      </div>
    </div>
    <script>
      (() => {
        const cv = document.getElementById("game");
        const ctx = cv.getContext("2d");
        const W = cv.width,
          H = cv.height;

        // --- sprite loader (LPC body sheets + FLARE tileset) ---
        // LPC walk: 576x256, 64x64 frames, 9 cols x 4 rows.
        // Rows: 0=up, 1=left, 2=down, 3=right. Col 0=stand, 1-8=walk cycle.
        const ASSETS = "../assets";
        const SPR = {
          skel:
            ASSETS +
            "/lpc-generator/spritesheets/body/bodies/skeleton/walk/skeleton.png",
          zomb:
            ASSETS +
            "/lpc-generator/spritesheets/body/bodies/zombie/walk/zombie.png",
          male:
            ASSETS + "/lpc-generator/spritesheets/body/bodies/male/walk.png",
          cast:
            ASSETS +
            "/lpc-generator/spritesheets/body/bodies/male/spellcast.png",
          dungeon:
            ASSETS +
            "/flare-game/mods/fantasycore/images/tilesets/tileset_dungeon.png",
        };
        const IMG = {};
        let assetsReady = false;
        let assetsTotal = 0,
          assetsLoaded = 0;
        for (const [k, src] of Object.entries(SPR)) {
          assetsTotal++;
          const img = new Image();
          img.onload = () => {
            assetsLoaded++;
            if (assetsLoaded === assetsTotal) assetsReady = true;
          };
          img.onerror = () => {
            assetsLoaded++;
            console.warn("missing asset:", src);
            if (assetsLoaded === assetsTotal) assetsReady = true;
          };
          img.src = src;
          IMG[k] = img;
        }

        // Pre-tinted offscreen versions for distinguishing minion classes.
        // Same skeleton sheet, drawn once with a colored overlay using
        // 'multiply' blend so the silhouette stays but the bones take a hue.
        const TINTS = {};
        function makeTint(srcImg, color) {
          const c = document.createElement("canvas");
          c.width = srcImg.width;
          c.height = srcImg.height;
          const cx = c.getContext("2d");
          cx.drawImage(srcImg, 0, 0);
          cx.globalCompositeOperation = "multiply";
          cx.fillStyle = color;
          cx.fillRect(0, 0, c.width, c.height);
          cx.globalCompositeOperation = "destination-in";
          cx.drawImage(srcImg, 0, 0);
          return c;
        }
        function ensureTints() {
          if (TINTS.ready || !assetsReady) return;
          if (!IMG.skel.complete || !IMG.zomb.complete || !IMG.male.complete)
            return;
          TINTS.skelGreen = makeTint(IMG.skel, "#80ff80"); // archer
          TINTS.skelPurple = makeTint(IMG.skel, "#c080ff"); // mage
          TINTS.zombRed = makeTint(IMG.zomb, "#ff5050"); // boss
          TINTS.zombGray = makeTint(IMG.zomb, "#888888"); // wolf
          TINTS.maleRed = makeTint(IMG.male, "#ff8060"); // bandit
          TINTS.ready = true;
        }

        // pick LPC walk frame: row by facing, col cycles with time when moving
        function lpcFrame(facing, moving) {
          const row = facing === "left" ? 1 : 3;
          const col = moving
            ? 1 + (Math.floor(performance.now() / 100) % 8)
            : 0;
          return { sx: col * 64, sy: row * 64, sw: 64, sh: 64 };
        }
        function drawSprite(sheet, facing, moving, x, y, scale) {
          const f = lpcFrame(facing, moving);
          const dw = 64 * scale,
            dh = 64 * scale;
          ctx.drawImage(
            sheet,
            f.sx,
            f.sy,
            f.sw,
            f.sh,
            x - dw / 2,
            y - dh + 14,
            dw,
            dh,
          );
        }

        const PRIORITIES = ["nearest", "weakest", "strongest"];
        const PRIORITY_LABEL = {
          nearest: "最近的敌人",
          weakest: "最弱的敌人",
          strongest: "最强的敌人",
        };

        // --- entities ---
        const state = {
          souls: 30,
          wave: 1,
          maxWave: 5,
          paused: false,
          over: false,
          priority: "nearest",
          necro: { x: 60, y: H / 2, hp: 50, hpMax: 50, dead: false },
          minions: [],
          enemies: [],
          projectiles: [],
          floats: [], // floating texts
          nextEnemySpawn: 60,
          enemiesToSpawn: 0,
          wavePhase: "pre", // pre, fighting, won
          waveTimer: 120,
        };

        const TYPES = {
          warrior: {
            name: "骷髅战士",
            cost: 10,
            hp: 28,
            dmg: 6,
            range: 22,
            atkCd: 50,
            speed: 0.9,
            color: "#c8c0a8",
            glyph: "⚔",
          },
          archer: {
            name: "骷髅弓手",
            cost: 15,
            hp: 18,
            dmg: 5,
            range: 180,
            atkCd: 70,
            speed: 0.7,
            color: "#b8a878",
            glyph: "🏹",
          },
          mage: {
            name: "骷髅法师",
            cost: 25,
            hp: 14,
            dmg: 12,
            range: 140,
            atkCd: 110,
            speed: 0.55,
            color: "#9888c8",
            glyph: "🔥",
          },
        };

        const ENEMY_KINDS = [
          {
            name: "Rat",
            hp: 12,
            dmg: 3,
            speed: 0.9,
            color: "#7a5a3a",
            glyph: "🐀",
            soul: 3,
          },
          {
            name: "Bandit",
            hp: 26,
            dmg: 6,
            speed: 0.7,
            color: "#a86848",
            glyph: "🗡",
            soul: 7,
          },
          {
            name: "Wolf",
            hp: 22,
            dmg: 8,
            speed: 1.2,
            color: "#888888",
            glyph: "🐺",
            soul: 6,
          },
          {
            name: "Boss",
            hp: 120,
            dmg: 14,
            speed: 0.5,
            color: "#c83030",
            glyph: "👹",
            soul: 40,
          },
        ];

        // --- helpers ---
        const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        const log = (msg, color) => {
          const el = document.getElementById("log");
          const d = document.createElement("div");
          d.textContent = msg;
          if (color) d.style.color = color;
          el.appendChild(d);
          el.scrollTop = el.scrollHeight;
          while (el.children.length > 60) el.removeChild(el.firstChild);
        };
        const spawnFloat = (x, y, text, color) => {
          state.floats.push({ x, y, text, color, life: 40 });
        };

        // --- summoning ---
        function summon(kind) {
          const t = TYPES[kind];
          if (!t || state.over) return;
          if (state.souls < t.cost) {
            log(`魂魄不足（需 ${t.cost}）`, "#a83030");
            return;
          }
          state.souls -= t.cost;
          const idx = state.minions.length;
          state.minions.push({
            kind,
            ...t,
            x: state.necro.x + 20 + (idx % 3) * 14,
            y: state.necro.y - 30 + Math.floor(idx / 3) * 30,
            hp: t.hp,
            hpMax: t.hp,
            cd: 0,
            target: null,
          });
          log(`🦴 召唤 ${t.name}`, "#b89860");
          updatePanel();
        }

        // --- waves ---
        function startWave() {
          const sizes = [4, 6, 8, 10, 1]; // wave 5 is boss
          const isBoss = state.wave === state.maxWave;
          state.enemiesToSpawn = sizes[state.wave - 1];
          state.nextEnemySpawn = 30;
          state.wavePhase = "fighting";
          document.getElementById("banner").textContent = isBoss
            ? "⚠ BOSS WAVE ⚠"
            : `第 ${state.wave} 波`;
          log(
            isBoss ? "⚠ BOSS 出现！" : `--- 第 ${state.wave} 波 ---`,
            isBoss ? "#c83030" : "#8888c8",
          );
        }

        function spawnEnemy() {
          const isBossWave = state.wave === state.maxWave;
          const kindIdx = isBossWave
            ? 3
            : Math.min(2, Math.floor(Math.random() * (state.wave + 1)));
          const k = ENEMY_KINDS[kindIdx];
          const scale = 1 + (state.wave - 1) * 0.15;
          state.enemies.push({
            ...k,
            hp: Math.floor(k.hp * scale),
            hpMax: Math.floor(k.hp * scale),
            dmg: Math.floor(k.dmg * scale),
            x: W - 20,
            y: 60 + Math.random() * (H - 120),
            cd: 0,
            target: null,
          });
          state.enemiesToSpawn--;
        }

        // --- AI: pick a target by priority ---
        function pickTarget(unit, pool) {
          if (!pool.length) return null;
          let best = pool[0],
            bestKey = Infinity;
          for (const e of pool) {
            let key;
            if (state.priority === "nearest") key = dist(unit, e);
            else if (state.priority === "weakest") key = e.hp;
            else key = -e.hp; // strongest
            // for enemies targeting minions, default to nearest
            if (pool === state.minions) key = dist(unit, e);
            if (key < bestKey) {
              bestKey = key;
              best = e;
            }
          }
          return best;
        }

        // --- combat tick ---
        function tickUnit(u, allies, foes, isMinion) {
          if (u.hp <= 0) return;
          if (!u.target || u.target.hp <= 0) u.target = pickTarget(u, foes);
          if (!u.target) return;

          const d = dist(u, u.target);
          if (d > u.range) {
            // move toward
            const dx = u.target.x - u.x,
              dy = u.target.y - u.y;
            const m = Math.hypot(dx, dy) || 1;
            u.x += (dx / m) * u.speed;
            u.y += (dy / m) * u.speed;
          } else {
            // attack
            if (u.cd <= 0) {
              u.cd = u.atkCd || 60;
              if (u.range > 40) {
                // ranged: spawn projectile
                state.projectiles.push({
                  x: u.x,
                  y: u.y,
                  tx: u.target,
                  dmg: u.dmg,
                  color: u.kind === "mage" ? "#ff6040" : "#ffd060",
                  speed: 4,
                  friendly: isMinion,
                });
              } else {
                // melee: instant
                u.target.hp -= u.dmg;
                spawnFloat(u.target.x, u.target.y, "-" + u.dmg, "#ff8080");
              }
            }
          }
          if (u.cd > 0) u.cd--;
        }

        function tickProjectile(p) {
          if (!p.tx || p.tx.hp <= 0) {
            p.dead = true;
            return;
          }
          const dx = p.tx.x - p.x,
            dy = p.tx.y - p.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 6) {
            p.tx.hp -= p.dmg;
            spawnFloat(
              p.tx.x,
              p.tx.y,
              "-" + p.dmg,
              p.friendly ? "#ff8080" : "#ffaa44",
            );
            p.dead = true;
            return;
          }
          p.x += (dx / d) * p.speed;
          p.y += (dy / d) * p.speed;
        }

        // --- main loop ---
        function update() {
          if (state.paused || state.over) return;

          // wave logic
          if (state.wavePhase === "pre") {
            state.waveTimer--;
            if (state.waveTimer <= 0) startWave();
          } else if (state.wavePhase === "fighting") {
            if (state.enemiesToSpawn > 0) {
              state.nextEnemySpawn--;
              if (state.nextEnemySpawn <= 0) {
                spawnEnemy();
                state.nextEnemySpawn = 30 + Math.random() * 40;
              }
            } else if (state.enemies.length === 0) {
              // wave clear
              const reward = 25 + state.wave * 10;
              state.souls += reward;
              log(`🏆 第 ${state.wave} 波清场！+${reward} 魂魄`, "#80c850");
              if (state.wave >= state.maxWave) {
                state.wavePhase = "won";
                state.over = true;
                document.getElementById("banner").textContent = "🏆 胜 利！";
                log("🏆 全部 5 波清场！按 R 重开", "#b89860");
              } else {
                state.wave++;
                state.wavePhase = "pre";
                state.waveTimer = 180;
                document.getElementById("banner").textContent =
                  `准备第 ${state.wave} 波…`;
              }
            }
          }

          // tick units
          for (const m of state.minions)
            tickUnit(m, state.minions, state.enemies, true);
          for (const e of state.enemies) {
            // enemies prioritize necro if close, else minion
            const allTargets = state.minions.filter((x) => x.hp > 0);
            if (state.necro.hp > 0) allTargets.push(state.necro);
            tickUnit(e, state.enemies, allTargets, false);
          }
          for (const p of state.projectiles) tickProjectile(p);

          // necro attack
          if (state.necro.hp > 0 && !state.necro.dead) {
            state.necro.cd = (state.necro.cd || 0) - 1;
            const closest = pickTarget(state.necro, state.enemies);
            if (
              closest &&
              dist(state.necro, closest) < 200 &&
              state.necro.cd <= 0
            ) {
              state.necro.cd = 90;
              state.projectiles.push({
                x: state.necro.x,
                y: state.necro.y,
                tx: closest,
                dmg: 4,
                color: "#80ff80",
                speed: 3,
                friendly: true,
              });
            }
          }

          // collect dead, grant souls
          state.enemies = state.enemies.filter((e) => {
            if (e.hp <= 0) {
              state.souls += e.soul;
              spawnFloat(e.x, e.y, "+" + e.soul + "魂", "#80c850");
              log(`💀 击杀 ${e.name}（+${e.soul} 魂）`, "#80c850");
              return false;
            }
            return true;
          });
          state.minions = state.minions.filter((m) => {
            if (m.hp <= 0) {
              log(`☠ ${m.name} 倒下了`, "#a86060");
              spawnFloat(m.x, m.y, "☠", "#a86060");
              return false;
            }
            return true;
          });
          state.projectiles = state.projectiles.filter((p) => !p.dead);
          state.floats = state.floats.filter((f) => {
            f.life--;
            f.y -= 0.5;
            return f.life > 0;
          });

          // necro death = lose
          if (state.necro.hp <= 0 && !state.over) {
            state.over = true;
            state.necro.dead = true;
            document.getElementById("banner").textContent = "💀 你陨落了";
            log("💀 死灵法师倒下，按 R 重开", "#c83030");
          }

          updatePanel();
        }

        function updatePanel() {
          document.getElementById("souls").textContent = state.souls;
          document.getElementById("wave").textContent =
            `${state.wave} / ${state.maxWave}`;
          document.getElementById("army").textContent = state.minions.length;
          for (const k of ["warrior", "archer", "mage"]) {
            const btn = document.getElementById("sum-" + k);
            btn.disabled = state.over || state.souls < TYPES[k].cost;
          }
        }

        // --- rendering ---
        function drawHpBar(x, y, w, frac, color) {
          ctx.fillStyle = "#000";
          ctx.fillRect(x - w / 2, y, w, 3);
          ctx.fillStyle = color || "#80c850";
          ctx.fillRect(x - w / 2, y, w * Math.max(0, frac), 3);
        }

        function render() {
          ensureTints();

          // bg: slice from FLARE dungeon tileset, fallback to dark fill
          if (
            assetsReady &&
            IMG.dungeon.complete &&
            IMG.dungeon.naturalWidth > 0
          ) {
            ctx.drawImage(IMG.dungeon, 0, 800, 720, 420, 0, 0, W, H);
            ctx.fillStyle = "rgba(13,13,18,0.55)";
            ctx.fillRect(0, 0, W, H);
          } else {
            ctx.fillStyle = "#1a1a22";
            ctx.fillRect(0, 0, W, H);
          }
          // ground line texture (subtle on top of dungeon)
          ctx.strokeStyle = "rgba(58,58,74,0.4)";
          for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 60 + i * 60);
            ctx.lineTo(W, 60 + i * 60);
            ctx.stroke();
          }
          // necro spawn zone
          ctx.fillStyle = "rgba(180,80,200,0.06)";
          ctx.fillRect(0, 0, 120, H);

          // necro: male body, spellcast pose if assets ready, else emoji fallback
          if (!state.necro.dead) {
            if (assetsReady && IMG.male.complete) {
              drawSprite(
                IMG.male,
                "right",
                true,
                state.necro.x,
                state.necro.y,
                0.85,
              );
              // hood/cape hint: small purple aura ring
              ctx.strokeStyle = "rgba(192,96,192,0.35)";
              ctx.beginPath();
              ctx.arc(state.necro.x, state.necro.y + 4, 22, 0, Math.PI * 2);
              ctx.stroke();
            } else {
              ctx.font = "28px serif";
              ctx.textAlign = "center";
              ctx.fillText("🧙", state.necro.x, state.necro.y + 8);
            }
            drawHpBar(
              state.necro.x,
              state.necro.y - 28,
              30,
              state.necro.hp / state.necro.hpMax,
              "#c060c0",
            );
          }

          // minions: skeleton walk, tinted by class
          ctx.textAlign = "center";
          for (const m of state.minions) {
            const moving = !m.target || dist(m, m.target) > m.range;
            let sheet = IMG.skel;
            if (m.kind === "archer" && TINTS.skelGreen) sheet = TINTS.skelGreen;
            else if (m.kind === "mage" && TINTS.skelPurple)
              sheet = TINTS.skelPurple;
            if (
              assetsReady &&
              sheet &&
              (sheet.complete || sheet.tagName === "CANVAS")
            ) {
              drawSprite(sheet, "right", moving, m.x, m.y, 0.7);
            } else {
              ctx.font = "20px serif";
              ctx.fillStyle = m.color;
              ctx.fillText(m.glyph, m.x, m.y + 6);
            }
            drawHpBar(m.x, m.y - 22, 24, m.hp / m.hpMax, "#80c850");
          }

          // enemies: zombie walk facing left
          for (const e of state.enemies) {
            let sheet = IMG.zomb;
            if (e.name === "Boss" && TINTS.zombRed) sheet = TINTS.zombRed;
            else if (e.name === "Wolf" && TINTS.zombGray)
              sheet = TINTS.zombGray;
            else if (e.name === "Bandit" && TINTS.maleRed)
              sheet = TINTS.maleRed;
            const scale =
              e.name === "Boss" ? 1.4 : e.name === "Rat" ? 0.5 : 0.75;
            if (
              assetsReady &&
              sheet &&
              (sheet.complete || sheet.tagName === "CANVAS")
            ) {
              drawSprite(sheet, "left", true, e.x, e.y, scale);
            } else {
              ctx.font = "20px serif";
              ctx.fillStyle = e.color;
              ctx.fillText(e.glyph, e.x, e.y + 6);
            }
            drawHpBar(
              e.x,
              e.y - 22,
              e.name === "Boss" ? 60 : 24,
              e.hp / e.hpMax,
              "#c84040",
            );
          }

          // projectiles
          for (const p of state.projectiles) {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }

          // floating texts
          ctx.font = "11px monospace";
          for (const f of state.floats) {
            ctx.fillStyle = f.color;
            ctx.globalAlpha = Math.min(1, f.life / 30);
            ctx.fillText(f.text, f.x, f.y);
          }
          ctx.globalAlpha = 1;

          // loading indicator
          if (!assetsReady) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, H - 24, W, 24);
            ctx.fillStyle = "#b89860";
            ctx.font = "12px monospace";
            ctx.textAlign = "center";
            ctx.fillText(
              `加载美术资源 ${assetsLoaded}/${assetsTotal}…`,
              W / 2,
              H - 8,
            );
          }

          // pause overlay
          if (state.paused) {
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = "#b89860";
            ctx.font = "24px monospace";
            ctx.textAlign = "center";
            ctx.fillText("— PAUSED —", W / 2, H / 2);
          }
        }

        function loop() {
          update();
          render();
          requestAnimationFrame(loop);
        }

        // --- input ---
        document.getElementById("sum-warrior").onclick = () =>
          summon("warrior");
        document.getElementById("sum-archer").onclick = () => summon("archer");
        document.getElementById("sum-mage").onclick = () => summon("mage");
        document.getElementById("prio").onclick = () => {
          const i = PRIORITIES.indexOf(state.priority);
          state.priority = PRIORITIES[(i + 1) % PRIORITIES.length];
          document.getElementById("prio").textContent =
            "优先：" + PRIORITY_LABEL[state.priority];
        };

        window.addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            state.paused = !state.paused;
            e.preventDefault();
          }
          if (e.code === "KeyR") location.reload();
        });

        // boot
        log("🦴 死灵法师准备就绪。按按钮召唤亡灵。", "#b89860");
        log("💡 战斗自动进行，你只能召唤、设优先级、看戏。", "#8888c8");
        document.getElementById("banner").textContent = "准备第 1 波…";
        updatePanel();
        loop();
      })();
    </script>
  </body>
</html>
